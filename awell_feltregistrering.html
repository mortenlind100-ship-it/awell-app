<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Awell Feltregistrering</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { background: #dce8f5; }
    .app { height: 100vh; }
    .kort-wrap { height: calc(100vh - 120px); display: flex; flex-direction: column; }
    #awell-map { flex: 1; min-height: 200px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

// ── Palette & design tokens ──────────────────────────────────────────────────
// Industrial/utilitarian: deep navy, safety-orange accents, mono type
const STYLES = `
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@300;400;500;600&display=swap');

  :root {
    /* Awell brand palette */
    --blue:      #1169b0;   /* Awell brand blå */
    --blue2:     #1a7fcc;   /* hover-blå */
    --blue3:     #e8f2fb;   /* lys blå baggrund */
    --blue4:     #b8d4ee;   /* border/divider */
    --blue5:     #0d5490;   /* dyb header */
    --accent:    #E8500A;   /* Awell orange accent */
    --accent2:   #FF7A38;
    --white:     #FFFFFF;
    --grey0:     #dce8f5;   /* page bg – tydelig blålig baggrund */
    --grey1:     #c8d6e8;
    --grey2:     #BFC8D6;
    --grey3:     #7A8EA3;
    --grey4:     #3D5166;
    --text:      #1A2B3C;
    --text2:     #4D6278;
    --red:       #C0392B;
    --green:     #1A7A4A;
    --radius:    10px;
    --shadow:    0 2px 12px rgba(0,63,127,0.10);
    --shadow2:   0 4px 20px rgba(0,63,127,0.16);
    --font:      'Open Sans', sans-serif;
    --font-head: 'Montserrat', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--grey0);
    color: var(--text);
    min-height: 100vh;
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--grey0);
  }

  /* ── Header ── */
  .header {
    background: var(--blue);
    padding: 0 16px;
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; gap: 12px;
    height: 60px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .header-logo {
    display: flex; align-items: center;
    flex-shrink: 0;
    padding: 4px 0;
  }
  .header-title { flex: 1; }
  .header-title h1 {
    font-family: var(--font-head);
    font-size: 13px; font-weight: 700;
    color: #fff; letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .header-title p {
    font-size: 10px; color: rgba(255,255,255,0.55);
    font-family: var(--font); margin-top: 1px;
  }
  .header-back {
    background: none; border: none; color: rgba(255,255,255,0.8);
    font-size: 24px; cursor: pointer; padding: 4px 6px 4px 0;
    line-height: 1;
  }

  /* ── Nav tabs ── */
  .nav {
    display: flex;
    background: var(--blue5);
    border-bottom: 1px solid rgba(255,255,255,0.12);
  }
  .nav-btn {
    flex: 1; padding: 10px 4px 9px;
    background: none; border: none; cursor: pointer;
    font-family: var(--font-head); font-size: 10px; font-weight: 600;
    color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 0.07em;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    transition: color 0.15s, background 0.15s;
    border-bottom: 3px solid transparent;
  }
  .nav-btn.active {
    color: #fff;
    border-bottom-color: var(--accent);
    background: rgba(255,255,255,0.08);
  }
  .nav-btn span { font-size: 18px; }

  /* ── Scrollable content ── */
  .content {
    flex: 1; overflow-y: auto;
    padding: 16px;
    padding-bottom: 40px;
  }

  /* ── Section headings ── */
  .section-label {
    font-family: var(--font-head);
    font-size: 10px; font-weight: 700;
    color: var(--blue); letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 10px; margin-top: 4px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-label::after {
    content: ''; flex: 1; height: 2px;
    background: linear-gradient(to right, var(--blue4), transparent);
    border-radius: 1px;
  }

  /* ── Cards ── */
  .card {
    background: #ffffff;
    border: 1px solid #a8c4de;
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 2px 14px rgba(17,105,176,0.13);
  }
  .card-title {
    font-family: var(--font-head);
    font-size: 11px; color: var(--grey3);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 10px;
  }

  /* ── Form elements ── */
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 10px; font-family: var(--font-head); font-weight: 700;
    color: var(--grey4); text-transform: uppercase;
    letter-spacing: 0.09em; margin-bottom: 5px;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    background: #ffffff;
    border: 1.5px solid #9ab5d4;
    border-radius: 7px;
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    padding: 10px 13px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    -webkit-appearance: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(17,105,176,0.18);
    background: #fff;
  }
  .field textarea { resize: vertical; min-height: 80px; }
  .field select option { background: #fff; }

  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }

  /* ── Buttons ── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 18px; border-radius: 8px; border: none; cursor: pointer;
    font-family: var(--font-head); font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
    width: 100%;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: linear-gradient(135deg, var(--blue2) 0%, var(--blue) 100%);
    color: #fff;
    box-shadow: 0 3px 12px rgba(0,63,127,0.30);
  }
  .btn-primary:hover { box-shadow: 0 5px 18px rgba(0,63,127,0.40); }
  .btn-secondary {
    background: var(--white); color: var(--blue);
    border: 1.5px solid var(--blue4);
  }
  .btn-teal {
    background: linear-gradient(135deg, var(--accent2) 0%, var(--accent) 100%);
    color: #fff;
    box-shadow: 0 3px 12px rgba(232,80,10,0.25);
  }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-sm { padding: 7px 14px; font-size: 11px; width: auto; }

  /* ── GPS badge ── */
  .gps-badge {
    display: flex; align-items: center; gap: 10px;
    background: #ffffff; border: 1.5px solid #a8c4de;
    border-radius: 8px; padding: 10px 13px;
    font-family: var(--font); font-size: 12px;
    margin-bottom: 14px;
  }
  .gps-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--green); flex-shrink: 0;
    box-shadow: 0 0 0 3px rgba(26,122,74,0.2);
  }
  .gps-dot.waiting { background: var(--accent); box-shadow: 0 0 0 3px rgba(232,80,10,0.2); }
  .gps-dot.error { background: var(--red); box-shadow: 0 0 0 3px rgba(192,57,43,0.2); }
  .gps-text { flex: 1; }
  .gps-text strong { color: var(--blue); display: block; font-size: 12px; font-weight: 600; }
  .gps-text span { color: var(--text2); font-size: 10px; }

  /* ── Well list ── */
  .well-item {
    display: flex; align-items: center;
    background: #ffffff; border: 1.5px solid #a8c4de;
    border-radius: var(--radius); padding: 13px 14px;
    margin-bottom: 10px; cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
    gap: 13px;
    box-shadow: 0 2px 14px rgba(17,105,176,0.13);
  }
  .well-item:active { transform: scale(0.985); border-color: var(--blue); box-shadow: var(--shadow2); }
  .well-icon {
    width: 42px; height: 42px; border-radius: 10px;
    background: var(--blue3);
    border: 1.5px solid var(--blue4);
    display: flex; align-items: center;
    justify-content: center; font-size: 20px; flex-shrink: 0;
  }
  .well-info { flex: 1; min-width: 0; }
  .well-name {
    font-family: var(--font-head); font-weight: 700;
    font-size: 14px; color: var(--blue);
  }
  .well-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .well-coord { font-size: 11px; color: var(--blue2); margin-top: 2px; font-weight: 500; }
  .well-arrow { color: var(--grey2); font-size: 20px; }
  .well-item.selected { border-color: var(--blue); background: var(--blue3); }

  /* ── Task type grid ── */
  .task-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px; margin-bottom: 14px;
  }
  .task-type-btn {
    background: #ffffff; border: 1.5px solid #a8c4de;
    border-radius: var(--radius); padding: 14px 10px;
    cursor: pointer; text-align: center; transition: all 0.15s;
    box-shadow: 0 2px 14px rgba(17,105,176,0.13);
  }
  .task-type-btn:active { transform: scale(0.96); }
  .task-type-btn.selected {
    border-color: var(--blue);
    background: var(--blue3);
    box-shadow: 0 0 0 3px rgba(0,63,127,0.12);
  }
  .task-type-btn .icon { font-size: 26px; margin-bottom: 7px; }
  .task-type-btn .label {
    font-family: var(--font-head); font-size: 10px; font-weight: 600;
    color: var(--text2); text-transform: uppercase; letter-spacing: 0.06em;
    line-height: 1.4;
  }
  .task-type-btn.selected .label { color: var(--blue); }

  /* ── Image grid ── */
  .img-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px; margin-bottom: 10px;
  }
  .img-thumb {
    aspect-ratio: 1; border-radius: 7px; overflow: hidden;
    position: relative; background: var(--grey1);
    border: 1px solid var(--grey1);
  }
  .img-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .img-del {
    position: absolute; top: 4px; right: 4px;
    background: rgba(192,57,43,0.88); border: none; border-radius: 50%;
    width: 22px; height: 22px; color: #fff; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .img-add {
    aspect-ratio: 1; border-radius: 7px;
    border: 2px dashed #9ab5d4; background: var(--blue3);
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; cursor: pointer;
    color: var(--blue); font-size: 22px; gap: 4px;
    transition: border-color 0.15s, background 0.15s;
  }
  .img-add:active { border-color: var(--blue); background: var(--blue3); }
  .img-add small { font-family: var(--font-head); font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text2); }
  .img-meta {
    font-size: 10px; color: var(--blue2); margin-top: 2px; text-align: center;
    font-weight: 500;
  }

  /* ── Saved tasks list ── */
  .task-item {
    background: #ffffff; border: 1.5px solid #a8c4de;
    border-radius: var(--radius); padding: 13px 15px;
    margin-bottom: 10px; cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
    box-shadow: 0 2px 14px rgba(17,105,176,0.13);
  }
  .task-item:active { border-color: var(--blue); }
  .task-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .task-tag {
    font-family: var(--font-head); font-size: 10px; font-weight: 700;
    padding: 3px 9px; border-radius: 5px;
    background: var(--blue); color: #fff;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .task-date { font-size: 11px; color: var(--text2); }
  .task-well { font-family: var(--font-head); font-weight: 700; font-size: 14px; color: var(--blue); margin-top: 5px; }
  .task-summary { font-size: 11px; color: var(--text2); margin-top: 3px; }

  /* ── Badge ── */
  .badge {
    display: inline-block;
    background: var(--accent); color: #fff;
    border-radius: 10px; font-size: 10px;
    font-family: var(--font-head); font-weight: 700;
    padding: 1px 8px; margin-left: 6px;
  }

  /* ── Divider ── */
  .divider { height: 1px; background: var(--grey1); margin: 16px 0; }

  /* ── Empty state ── */
  .empty {
    text-align: center; padding: 50px 20px;
    color: var(--grey3); font-size: 13px;
  }
  .empty .icon { font-size: 44px; margin-bottom: 14px; opacity: 0.5; }
  .empty p { font-family: var(--font-head); font-weight: 600; color: var(--grey3); }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    background: var(--blue); border: none;
    color: #fff; font-family: var(--font-head); font-size: 12px; font-weight: 600;
    padding: 11px 22px; border-radius: 24px; z-index: 999;
    box-shadow: 0 4px 20px rgba(0,63,127,0.35);
    animation: toastIn 0.3s ease;
    white-space: nowrap; letter-spacing: 0.04em;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(14px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  /* ── Depth indicator visual ── */
  .depth-viz {
    display: flex; align-items: stretch; gap: 12px;
    margin-bottom: 14px;
  }
  .depth-bar {
    width: 20px; border-radius: 6px;
    background: linear-gradient(to bottom, var(--blue2) 0%, var(--blue3) 100%);
    position: relative; min-height: 80px;
    border: 1.5px solid var(--blue4);
  }
  .depth-info { flex: 1; display: flex; flex-direction: column; gap: 5px; }
  .depth-row {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--blue3); border-radius: 6px; padding: 6px 11px;
    border: 1px solid #a8c4de;
  }
  .depth-row .key { color: var(--text2); font-size: 10px; font-family: var(--font-head); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
  .depth-row .val { color: var(--blue); font-weight: 700; font-size: 13px; font-family: var(--font-head); }

  /* ── Toggle ── */
  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px; padding: 2px 0;
  }
  .toggle-label { font-family: var(--font-head); font-size: 12px; font-weight: 600; color: var(--text); }
  .toggle {
    width: 46px; height: 26px; border-radius: 13px;
    background: #b8cfe6; border: 1.5px solid #9ab5d4;
    cursor: pointer; transition: background 0.2s, border-color 0.2s; position: relative;
    flex-shrink: 0;
  }
  .toggle.on { background: var(--blue); border-color: var(--blue); }
  .toggle::after {
    content: ''; position: absolute;
    width: 19px; height: 19px; border-radius: 50%;
    background: #fff; top: 2px; left: 2px;
    transition: left 0.2s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.18);
  }
  .toggle.on::after { left: 22px; }

  /* ── Chip select ── */
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
  .chip {
    padding: 5px 13px; border-radius: 16px;
    border: 1.5px solid #9ab5d4; background: #ffffff;
    font-family: var(--font-head); font-size: 11px; font-weight: 600;
    cursor: pointer; color: var(--text2); transition: all 0.15s;
    letter-spacing: 0.03em;
  }
  .chip.active { background: var(--blue); color: #fff; border-color: var(--blue); }

  /* ── Pump photo btn ── */
  .pump-photo-btn {
    width: 100%; padding: 13px;
    background: var(--blue3); border: 2px dashed var(--blue4);
    border-radius: 8px; color: var(--blue);
    font-family: var(--font-head); font-size: 12px; font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    letter-spacing: 0.06em; text-transform: uppercase;
    transition: background 0.15s, border-color 0.15s;
  }
  .pump-photo-btn:active { background: var(--blue4); }

  /* ── Jupiter ── */
  .jupiter-wrap { padding: 16px; padding-bottom: 40px; overflow-y: auto; flex: 1; }
  .jupiter-search {
    display: flex; gap: 8px; margin-bottom: 16px;
  }
  .jupiter-search input {
    flex: 1; background: #fff; border: 1.5px solid #9ab5d4;
    border-radius: 7px; color: var(--text); font-family: var(--font);
    font-size: 15px; padding: 11px 13px; outline: none;
    transition: border-color 0.15s;
  }
  .jupiter-search input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(17,105,176,0.15); }
  .jupiter-search button {
    background: linear-gradient(135deg, var(--blue2), var(--blue));
    color: #fff; border: none; border-radius: 7px;
    padding: 11px 16px; font-family: var(--font-head); font-size: 12px;
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    cursor: pointer; white-space: nowrap;
  }
  .jupiter-search button:active { opacity: 0.85; }
  .jupiter-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--blue3); border: 1px solid var(--blue4);
    border-radius: 20px; padding: 4px 12px; margin-bottom: 14px;
    font-family: var(--font-head); font-size: 11px; font-weight: 700;
    color: var(--blue); text-transform: uppercase; letter-spacing: 0.06em;
  }
  .jupiter-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .jupiter-section { margin-bottom: 18px; }
  .jupiter-row {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 8px 0; border-bottom: 1px solid #e0eaf4;
    gap: 8px;
  }
  .jupiter-row:last-child { border-bottom: none; }
  .jupiter-row .jk {
    font-family: var(--font-head); font-size: 11px; font-weight: 700;
    color: var(--text2); text-transform: uppercase; letter-spacing: 0.06em;
    flex-shrink: 0; min-width: 130px;
  }
  .jupiter-row .jv {
    font-size: 13px; color: var(--text); font-weight: 500; text-align: right;
  }
  .jupiter-spinner {
    text-align: center; padding: 40px 20px;
    font-family: var(--font-head); font-size: 12px; color: var(--text2);
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .jupiter-spinner .spin {
    display: inline-block; width: 32px; height: 32px;
    border: 3px solid var(--blue3); border-top-color: var(--blue);
    border-radius: 50%; animation: spin 0.8s linear infinite;
    margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .jupiter-error {
    background: #fff0f0; border: 1.5px solid #f5c0c0;
    border-radius: 8px; padding: 14px; color: var(--red);
    font-size: 13px; margin-bottom: 14px;
    font-family: var(--font-head); font-weight: 600;
  }
  .jupiter-lithology {
    display: flex; flex-direction: column; gap: 0;
    border-radius: 8px; overflow: hidden;
    border: 1px solid #a8c4de; margin-top: 4px;
  }
  .lith-row {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 10px; border-bottom: 1px solid #dceaf5;
    font-size: 12px;
  }
  .lith-row:last-child { border-bottom: none; }
  .lith-depth { font-family: var(--font-head); font-size: 11px; font-weight: 700; color: var(--blue); min-width: 80px; }
  .lith-desc { color: var(--text); flex: 1; }
  .lith-color { width: 16px; height: 16px; border-radius: 3px; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.15); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--grey0); }
  ::-webkit-scrollbar-thumb { background: var(--blue4); border-radius: 2px; }

  /* ── GPS Proximity ── */
  .prox-banner {
    display: flex; align-items: center; gap: 12px;
    border-radius: 10px; padding: 14px 16px;

// WGS84 → UTM zone 32N (EUREF89/ED50, EPSG:25832)
const wgs84ToUtm32 = (lat, lng) => {
  const a = 6378137.0, f = 1/298.257223563;
  const b = a*(1-f), e2 = 1 - (b/a)**2;
  const k0 = 0.9996, lon0 = 9 * Math.PI/180; // zone 32 central meridian
  const latR = lat * Math.PI/180, lngR = lng * Math.PI/180;
  const N = a / Math.sqrt(1 - e2*Math.sin(latR)**2);
  const T = Math.tan(latR)**2;
  const C = e2/(1-e2) * Math.cos(latR)**2;
  const A = Math.cos(latR) * (lngR - lon0);
  const e4 = e2*e2, e6 = e2**3;
  const M = a*((1 - e2/4 - 3*e4/64 - 5*e6/256)*latR
              - (3*e2/8 + 3*e4/32 + 45*e6/1024)*Math.sin(2*latR)
              + (15*e4/256 + 45*e6/1024)*Math.sin(4*latR)
              - (35*e6/3072)*Math.sin(6*latR));
  const easting = k0*N*(A + (1-T+C)*A**3/6 + (5-18*T+T**2+72*C-58*e2/(1-e2))*A**5/120) + 500000;
  const northing = k0*(M + N*Math.tan(latR)*(A**2/2 + (5-T+9*C+4*C**2)*A**4/24 + (61-58*T+T**2+600*C-330*e2/(1-e2))*A**6/720));
  return { e: Math.round(easting), n: Math.round(northing) };
};

// Format GPS position as UTM32 EUREF89 string
const fmtUtm32 = (lat, lng) => {
  if (!lat || !lng) return "Ikke tilgængelig";
  const { e, n } = wgs84ToUtm32(parseFloat(lat), parseFloat(lng));
  return `E ${e.toLocaleString("da-DK")}  N ${n.toLocaleString("da-DK")}`;
};

// Format short: "E 707376 N 6222197"
const fmtUtm32Short = (lat, lng) => {
  if (!lat || !lng) return null;
  const { e, n } = wgs84ToUtm32(parseFloat(lat), parseFloat(lng));
  return `E ${e}  N ${n}`;
};

// ── Haversine distance (metres) between two WGS84 coords ─────────────────────
function haversineM(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ── Convert UTM32 (EPSG:25832) to WGS84 approx ─────────────────────────────
// Simple approximation valid for Denmark
function utm32ToWgs84(easting, northing) {
  // UTM zone 32N centre meridian = 9° E
  const k0 = 0.9996, a = 6378137, e2 = 0.00669438;
  const e1sq = e2 / (1 - e2);
  const x = easting - 500000;
  const y = northing;
  const M = y / k0;
  const mu = M / (a * (1 - e2/4 - 3*e2*e2/64));
  const phi1 = mu + (3*e2/2 - 27*e2**3/32)*Math.sin(2*mu)
             + (21*e2**2/16)*Math.sin(4*mu)
             + (151*e2**3/96)*Math.sin(6*mu);
  const N1 = a / Math.sqrt(1 - e2*Math.sin(phi1)**2);
  const T1 = Math.tan(phi1)**2;
  const C1 = e1sq*Math.cos(phi1)**2;
  const R1 = a*(1-e2) / Math.pow(1-e2*Math.sin(phi1)**2, 1.5);
  const D  = x / (N1*k0);
  const lat = phi1 - (N1*Math.tan(phi1)/R1)*(D**2/2-(5+3*T1+10*C1-4*C1**2-9*e1sq)*D**4/24+(61+90*T1+298*C1+45*T1**2-252*e1sq-3*C1**2)*D**6/720);
  const lon = (D-(1+2*T1+C1)*D**3/6+(5-2*C1+28*T1-3*C1**2+8*e1sq+24*T1**2)*D**5/120) / Math.cos(phi1) + 9*Math.PI/180;
  return [lat * 180/Math.PI, lon * 180/Math.PI];
}

// ── ProximityBanner component ────────────────────────────────────────────────
function ProximityBanner({ well, gps }) {
  // Get well coordinates in WGS84
  let wellLat = null, wellLng = null;

  if (well.lat && well.lng) {
    // App-registered boring has WGS84 coords
    wellLat = parseFloat(well.lat);
    wellLng = parseFloat(well.lng);
  } else if (well.utmx && well.utmy) {
    // Jupiter boring has UTM32 coords — convert
    [wellLat, wellLng] = utm32ToWgs84(parseFloat(well.utmx), parseFloat(well.utmy));
  }

  if (!wellLat || !wellLng) {
    return (
      <div className="prox-banner nogps">
        <div className="prox-icon">📍</div>
        <div>
          <div className="prox-title nogps">Ingen koordinat</div>
          <div className="prox-sub">Boringen har ingen registreret koordinat</div>
        </div>
      </div>
    );
  }

  if (gps.status !== "ok") {
    return (
      <div className="prox-banner nogps">
        <div className="prox-icon">📡</div>
        <div>
          <div className="prox-title nogps">GPS ikke aktiv</div>
          <div className="prox-sub">Aktiver lokation for at bekræfte position</div>
        </div>
      </div>
    );
  }

  const dist = haversineM(gps.lat, gps.lng, wellLat, wellLng);
  const distRound = dist < 10 ? dist.toFixed(1) : Math.round(dist);
  const unit = dist >= 1000 ? "km" : "m";
  const distDisplay = dist >= 1000 ? (dist/1000).toFixed(2) : distRound;

  let state, icon, title, sub;
  if (dist <= 5) {
    state = "confirmed";
    icon  = "✅";
    title = "Korrekt boring bekræftet";
    sub   = `Du er ${distDisplay} m fra boringens koordinat`;
  } else if (dist <= 25) {
    state = "close";
    icon  = "🟡";
    title = "Tæt på – tjek placering";
    sub   = `${distDisplay} m fra boringens koordinat`;
  } else {
    state = "far";
    icon  = "📍";
    title = "Afstand til boring";
    sub   = `GPS ±${Math.round(gps.acc)}m nøjagtighed`;
  }

  return (
    <div className={`prox-banner ${state}`}>
      <div className="prox-icon">{icon}</div>
      <div>
        <div className={`prox-title ${state}`}>{title}</div>
        <div className="prox-sub">{sub}</div>
      </div>
      <div className={`prox-dist ${state}`}>
        <div className="num">{distDisplay}</div>
        <div className="unit">{unit}</div>
      </div>
    </div>
  );
}

// ── MapView component (Leaflet) ───────────────────────────────────────────────
function MapView({ wells, tasks, onSelectWell, mapInstanceRef, markersRef, mapRef }) {
  useEffect(() => {
    if (!mapRef.current) return;
    if (mapInstanceRef.current) {
      // Update markers when wells/tasks change without re-creating map
      markersRef.current.forEach(m => m.remove());
      markersRef.current = [];
      addMarkers();
      return;
    }

    // Default center: Denmark
    const defaultLat = 56.0, defaultLng = 10.5;
    const validWells = wells.filter(w => w.lat && w.lng);
    const centerLat = validWells.length ? validWells[0].lat : defaultLat;
    const centerLng = validWells.length ? validWells[0].lng : defaultLng;

    const map = window.L.map(mapRef.current, {
      center: [centerLat, centerLng],
      zoom: validWells.length > 1 ? 10 : 14,
      zoomControl: true,
    });
    mapInstanceRef.current = map;

    window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap",
      maxZoom: 19,
    }).addTo(map);

    addMarkers();

    // Fit bounds if multiple wells
    if (validWells.length > 1) {
      const bounds = window.L.latLngBounds(validWells.map(w => [parseFloat(w.lat), parseFloat(w.lng)]));
      map.fitBounds(bounds, { padding: [40, 40] });
    }

    function addMarkers() {
      const map = mapInstanceRef.current;
      wells.filter(w => w.lat && w.lng).forEach(w => {
        const wellTaskCount = tasks.filter(t => t.wellId === w.id).length;
        const icon = window.L.divIcon({
          className: "",
          html: `<div style="
            background: #1169b0;
            border: 3px solid #fff;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            width: 32px; height: 32px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.35);
            display: flex; align-items: center; justify-content: center;
          "><span style="transform: rotate(45deg); font-size: 14px; display: block; text-align: center; line-height: 26px;">${wellTaskCount > 0 ? "⛏️" : "⚪"}</span></div>
          ${wellTaskCount > 0 ? `<div style="position:absolute;top:-6px;right:-6px;background:#E8500A;color:#fff;border-radius:10px;font-size:10px;font-weight:700;padding:1px 5px;font-family:sans-serif;">${wellTaskCount}</div>` : ""}`,
          iconSize: [32, 32],
          iconAnchor: [16, 32],
          popupAnchor: [0, -34],
        });
        const marker = window.L.marker([parseFloat(w.lat), parseFloat(w.lng)], { icon })
          .addTo(map)
          .on("click", () => onSelectWell(w));
        markersRef.current.push(marker);
      });
    }

    return () => {
      // don't destroy on re-render, only on unmount
    };
  }, [wells, tasks]);

  // Re-add markers when data changes but map exists
  useEffect(() => {
    if (!mapInstanceRef.current) return;
    markersRef.current.forEach(m => m.remove());
    markersRef.current = [];
    wells.filter(w => w.lat && w.lng).forEach(w => {
      const wellTaskCount = tasks.filter(t => t.wellId === w.id).length;
      const icon = window.L.divIcon({
        className: "",
        html: `<div style="background:#1169b0;border:3px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);width:32px;height:32px;box-shadow:0 2px 8px rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;"><span style="transform:rotate(45deg);font-size:14px;display:block;text-align:center;line-height:26px;">${wellTaskCount > 0 ? "⛏️" : "⚪"}</span></div>${wellTaskCount > 0 ? `<div style="position:absolute;top:-6px;right:-6px;background:#E8500A;color:#fff;border-radius:10px;font-size:10px;font-weight:700;padding:1px 5px;font-family:sans-serif;">${wellTaskCount}</div>` : ""}`,
        iconSize: [32, 32], iconAnchor: [16, 32],
      });
      const marker = window.L.marker([parseFloat(w.lat), parseFloat(w.lng)], { icon })
        .addTo(mapInstanceRef.current)
        .on("click", () => onSelectWell(w));
      markersRef.current.push(marker);
    });
  }, [wells, tasks]);

  return <div ref={mapRef} id="awell-map" style={{ flex: 1, minHeight: 0 }} />;
}

  const fetchJupiter = async (dgu) => {
    const raw = dgu.trim().replace(/^dgu\s*/i, "").trim();
    if (!raw) return;
    setJupiterLoading(true);
    setJupiterError(null);
    setJupiterData(null);

    try {
      const proxyUrl = `/api/jupiter?dgu=${encodeURIComponent(raw)}`;
      let r;
      try {
        r = await fetch(proxyUrl);
      } catch (networkErr) {
        throw new Error(`Netværksfejl ved kald til proxy: ${networkErr.message}`);
      }

      // Show exact HTTP status and body for diagnosis
      const text = await r.text();
      let d;
      try { d = JSON.parse(text); } catch(_) {
        throw new Error(`Proxy svarede HTTP ${r.status} med: ${text.slice(0, 200)}`);
      }

      if (d.attempts) setJupiterDiag(d.attempts);
      if (!r.ok) throw new Error(d.error || `Proxy HTTP ${r.status}`);
      setJupiterDiag(null);
      setJupiterData({ ...d, dgu: raw });
      // Also store field names for debug
      if (d.boring?._allefelter) console.log("Jupiter felter:", d.boring._allefelter);

      setJupiterError(e.message || "Ukendt fejl");
    }
    setJupiterLoading(false);
  };

              <JRow k="Forerør Ø (mm)"      v={b.forerorDiameter} />
              <JRow k="Ro. vandstand (m)"   v={b.rovandstand} />
              <JRow k="Indvinding (m³/år)"  v={b.indvinding} />
              <JRow k="Boremetode"          v={b.boremetode} />
              <JRow k="Ejer"                v={b.ejer} />
              <JRow k="Journal"             v={b.journal} />
            </div>

            {/* Vandstand historik */}
            {jupiterData.vandstand && jupiterData.vandstand.length > 0 && (<>
              <div className="section-label">Vandstandsmålinger ({jupiterData.vandstand.length})</div>
              <div className="card" style={{ padding:"8px 12px" }}>
                <div style={{ display:"flex", gap:8, padding:"4px 8px 8px", borderBottom:"1px solid var(--grey1)" }}>
                  {["Dato","Pejling (m)","Kote (m.o.h.)"].map(h => (
                    <div key={h} style={{ flex:1, fontFamily:"var(--font-head)", fontWeight:700, fontSize:10, color:"var(--text2)", textTransform:"uppercase", letterSpacing:"0.06em" }}>{h}</div>
                  ))}
                </div>
                {jupiterData.vandstand.slice(0,15).map((v,i) => (
                  <div key={i} style={{ display:"flex", gap:8, padding:"5px 8px", borderBottom:"1px solid var(--grey1)", fontSize:12 }}>
                    <div style={{ flex:1, fontFamily:"var(--font-head)", fontWeight:500, color:"var(--blue)" }}>{v.dato}</div>
                    <div style={{ flex:1 }}>{v.pejling}</div>
                    <div style={{ flex:1, color:"var(--text2)" }}>{v.kote}</div>
                  </div>
                ))}
                {jupiterData.vandstand.length > 15 && (
                  <div style={{ padding:"6px 8px", fontSize:10, color:"var(--text2)", fontStyle:"italic" }}>
                    + {jupiterData.vandstand.length - 15} yderligere målinger — se fuld rapport
                  </div>
                )}
              </div>
            </>)}

            {/* Anlæg / indvindingsanlæg */}
            {anlaeg.length > 0 && (<>
              <div className="section-label">Anlæg / indvinding ({anlaeg.length})</div>
              {anlaeg.map((a, i) => (
                <div key={i} className="card" style={{ marginBottom:8 }}>
                  <JRow k="Anlæg ID"    v={a.anlaegId} />
                  <JRow k="Type"        v={a.type} />
                  <JRow k="Navn"        v={a.navn} />
                  <JRow k="Kapacitet"   v={a.kapacitet} />
                  <JRow k="Dybde (m)"   v={a.dybde} />
                  <JRow k="Status"      v={a.status} />
                </div>
              ))}
            </>)}

            {/* Litologi / cyklogram */}
            {litho.length > 0 && (<>
              <div className="section-label">Litologi – {litho.length} lag</div>
              <div className="card" style={{ padding:"8px 12px" }}>
                <div className="jupiter-lithology">
                  {litho.map((l, i) => (
                    <div key={i} className="lith-row">
                      <div className="lith-depth">{l.fraM ?? "?"} – {l.tilM ?? "?"} m</div>
                      <div className="lith-desc">{l.tekst || l.symbol || "–"}</div>
                      <div className="lith-color" style={{ background: lithoColor(l.tekst) }} />
                    </div>
                  ))}
                </div>
              </div>
            </>)}

            {/* Links */}
            <div style={{ display:"flex", gap:8, marginTop:8, flexWrap:"wrap" }}>
              <a href={`https://data.geus.dk/JupiterWWW/#dguNr=${jupiterData.dgu}`}
                target="_blank" rel="noopener"
                style={{ flex:1, textAlign:"center", background:"var(--blue3)", border:"1px solid var(--blue4)",
                  borderRadius:7, padding:"8px 12px", fontFamily:"var(--font-head)", fontWeight:700,
                  fontSize:11, color:"var(--blue)", textDecoration:"none", letterSpacing:"0.05em" }}>
                🌍 Åbn i Jupiter Online
              </a>
              {b.pdfUrl && (
                <a href={b.pdfUrl} target="_blank" rel="noopener"
                  style={{ flex:1, textAlign:"center", background:"var(--blue)", borderRadius:7,
                    padding:"8px 12px", fontFamily:"var(--font-head)", fontWeight:700,
                    fontSize:11, color:"#fff", textDecoration:"none", letterSpacing:"0.05em" }}>
                  📄 Download PDF borerapport
                </a>
              )}
              {!b.pdfUrl && b.boreholeUrl && (
                <a href={b.boreholeUrl} target="_blank" rel="noopener"
                  style={{ flex:1, textAlign:"center", background:"var(--blue3)", border:"1.5px solid var(--blue4)", borderRadius:7,
                    padding:"8px 12px", fontFamily:"var(--font-head)", fontWeight:700,
                    fontSize:11, color:"var(--blue)", textDecoration:"none", letterSpacing:"0.05em" }}>
                  🌐 Åbn borerapport (HTML)
                </a>
              )}
            </div>

            {/* Debug: vis feltnavne hvis ingen data */}
            {meta.lithoCount === 0 && meta.anlaegCount === 0 && (
              <div style={{ marginTop:12, fontSize:10, color:"var(--text2)", fontStyle:"italic", textAlign:"center" }}>
                Kun basisdata fra WFS-lag jupiter_boringer_ws. Litologi og anlægsdata ikke tilgængeligt for denne boring.
              </div>
            )}
          </>);
        })()}
      </div>
    );
  };

  // ── Kort ──
  const renderKort = () => {
    const sw = selectedMapWell;
    const wellTasks = sw ? tasks.filter(t => t.wellId === sw.id) : [];
    const taskLabel = id => TASK_TYPES.find(t => t.id === id)?.label.replace("\n"," ") || id;

    return (
      <div className="kort-wrap" style={{ display: "flex", flexDirection: "column", flex: 1, overflow: "hidden" }}>
        <MapView
          wells={wells}
          tasks={tasks}
          onSelectWell={setSelectedMapWell}
          mapInstanceRef={mapInstanceRef}
          markersRef={markersRef}
          mapRef={mapRef}
        />
        {sw && (
          <div className="kort-panel-wrap" style={{ position: "relative" }}>
            <div className="kort-panel">
              <button className="kort-close" onClick={() => setSelectedMapWell(null)}>×</button>
              <div className="kort-panel-title">⛏️ {sw.name}</div>
              <div className="kort-panel-coord">📍 {fmtCoord(sw.lat, sw.lng)}</div>

              <div className="kort-data-grid">
                {sw.depth && <div className="kort-data-cell"><div className="k">Bundpejling</div><div className="v">{sw.depth} m</div></div>}
                {sw.rovand && <div className="kort-data-cell"><div className="k">Rovandspejling</div><div className="v">{sw.rovand} m</div></div>}
                {sw.maalepunkt && <div className="kort-data-cell"><div className="k">Målepunkt</div><div className="v">{sw.maalepunkt}</div></div>}
                {sw.maalepunktHoejde && <div className="kort-data-cell"><div className="k">Højde m.o.t.</div><div className="v">{sw.maalepunktHoejde} m</div></div>}
                {sw.casing?.innerDia && <div className="kort-data-cell"><div className="k">Forerør indre Ø</div><div className="v">{sw.casing.innerDia} mm</div></div>}
                {sw.casing?.outerDia && <div className="kort-data-cell"><div className="k">Forerør ydre Ø</div><div className="v">{sw.casing.outerDia} mm</div></div>}
                {sw.casing?.material && <div className="kort-data-cell"><div className="k">Forerør mat.</div><div className="v">{sw.casing.material}</div></div>}
                {sw.casing?.flangeDN && <div className="kort-data-cell"><div className="k">Flange DN</div><div className="v">{sw.casing.flangeDN}</div></div>}
                {sw.hasPump && sw.pump?.type && <div className="kort-data-cell"><div className="k">Pumpetype</div><div className="v">{sw.pump.type}</div></div>}
                {sw.hasPump && sw.pump?.riserDim && <div className="kort-data-cell"><div className="k">Stigrør dim.</div><div className="v">{sw.pump.riserDim === "Andet" ? sw.pump.riserDimCustom : sw.pump.riserDim}</div></div>}
                {sw.hasPump && sw.pump?.riserLength && <div className="kort-data-cell"><div className="k">Stigrør længde</div><div className="v">{sw.pump.riserLength} m</div></div>}
                {sw.hasPump && sw.pump?.riserDepth && <div className="kort-data-cell"><div className="k">Pumpedybde</div><div className="v">{sw.pump.riserDepth} m</div></div>}
                {sw.hasWellChamber && sw.wellChamber?.ringDia && <div className="kort-data-cell"><div className="k">Brønd Ø</div><div className="v">{sw.wellChamber.ringDia} mm</div></div>}
                {sw.hasWellChamber && sw.wellChamber?.depth && <div className="kort-data-cell"><div className="k">Brønddybde</div><div className="v">{sw.wellChamber.depth} m</div></div>}
              </div>

              {sw.pump?.pumpImage && (
                <div style={{ marginBottom: 12 }}>
                  <div className="section-label" style={{ marginBottom: 6 }}>Pumpefoto</div>
                  <img src={sw.pump.pumpImage.dataUrl} alt="Pumpe" style={{ width: "100%", maxHeight: 140, objectFit: "cover", borderRadius: 8, border: "1px solid #a8c4de" }} />
                </div>
              )}

              {(sw.wellImages || []).length > 0 && (
                <div style={{ marginBottom: 12 }}>
                  <div className="section-label" style={{ marginBottom: 6 }}>Fotos</div>
                  <div className="kort-img-row">
                    {sw.wellImages.map(img => <img key={img.id} src={img.dataUrl} alt="" />)}
                  </div>
                </div>
              )}

              {wellTasks.length > 0 && (
                <>
                  <div className="section-label" style={{ marginBottom: 8 }}>Serviceopgaver ({wellTasks.length})</div>
                  {wellTasks.map(t => (
                    <div key={t.id} className="kort-task-item">
                      <div className="kt-header">
                        <span className="kt-tag">{taskLabel(t.type)}</span>
                        <span className="kt-date">{fmtDate(t.date)}</span>
                      </div>
                      {t.techName && <div className="kt-notes">👤 {t.techName}</div>}
                      {t.notes && <div className="kt-notes">{t.notes}</div>}
                      {(t.images||[]).length > 0 && (
                        <div className="kort-img-row">
                          {t.images.map(img => <img key={img.id} src={img.dataUrl} alt="" />)}
                        </div>
                      )}
                    </div>
                  ))}
                </>
              )}
              {wellTasks.length === 0 && (
                <div style={{ color: "var(--text2)", fontSize: 12, fontStyle: "italic" }}>Ingen registrerede serviceopgaver endnu.</div>
              )}
            </div>
          </div>
        )}
        {!sw && (
          <div style={{ background: "#fff", borderTop: "1px solid #a8c4de", padding: "12px 16px", fontSize: 12, color: "var(--text2)", textAlign: "center", fontFamily: "var(--font-head)", fontWeight: 600, letterSpacing: "0.04em" }}>
            TAP EN MARKØR FOR AT SE FELTDATA
          </div>
        )}
      </div>
    );
  };

  // ── Layout ──
  const headerTitle = view === "editWell" ? "FELTDATA BORING" : view === "task" ? "Ny Opgave" : tab === "tasks" ? "Opgaver" : tab === "jupiter" ? "Jupiter" : tab === "kort" ? "Kort" : "Boringer";

  return (
    <>
      <style>{STYLES}</style>
      <div className="app">
        <div className="header">
          {(view === "task" || view === "editWell") && (
            <button className="header-back" onClick={() => setView("wells")}>‹</button>
          )}
          <div className="header-logo">
            <img
              src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAMCAgICAgMCAgIDAwMDBAYEBAQEBAgGBgUGCQgKCgkICQkKDA8MCgsOCwkJDRENDg8QEBEQCgwSExIQEw8QEBD/2wBDAQMDAwQDBAgEBAgQCwkLEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBD/wAARCABYAHUDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwDxKiiiv6FP56CiiigAooooAKYZYgdplQHpgsM08dRX6UfCrwb4Quv2O9O1e58K6PLfHwbczG5ewiaUuIJSGLld2eBznNeTm+axymEJyjzc0rb2PWyjKZZtOcIy5eVX2ufmvRTISTDGT3Rf5U+vXPICiiikMKKKKACiiigAooooAKKKKACkJCgsegGTS02T/VP/ALjfypoR6tqP7MPxt0fwQ/xH1DwhHF4ejsF1Rrv+0bdiLZkDh9gff91gcYz7V92/CT/kyrTf+xJuv/REtO+JH/Jk97/2Idt/6Sx034S/8mV6d/2JV1/6Ilr8vzPNK2aYSMqyS5atla+1vNs/UMsyujleKlGi2+ald3tvddkj4K+HP7NHxo+KPha38WeB/CUeoaXI7W6ztqFvCS8Z2sNsjhuD3xXm1xBLa3EtrOu2SGRonGc4ZSQR+YNfpZ+wD/yblpv/AGFL/wD9G1+buu/8h3U/+v65/wDRrV9llmaVsbjcTh6iXLTdla993vr5eR8dmeV0cFgsNiKbd6iu72tsttPPzKVFFFe6eCFFFFABRRRQAUUUUAFFFFABTZP9U/8AuN/KnU2T/VP/ALjfyprcTP1F+JH/ACZPe/8AYh23/pLHTfhLn/hizTRg/wDIlXXb/phLS/Er/kyW+/7EK3/9JY6/Mpda1qKD7HFrWopbhSghW8lEYX02hsY9sYr80yjKXm2GqQU+Xlq32v09UfpWb5sspxNObhzc1K29uvoz9Iv2Af8Ak3LTf+wpf/8Ao2vzd13/AJDup/8AX9c/+jWr9Jf2Bf8Ak3ex/wCwtqH/AKOr82td/wCQ7qf/AF/XP/o1q9vIP+Rpj/8AEvzkeNn/APyK8D/hf5RKVFFFfXnx4UUUUAFFFFABRRRQAUUUUAFNcEoyjqVIH5V03w48B6z8TfHGjeBNATN5q9ysIfblYYxzJK3+yiBmP0x3r2H9oD4I/DPQfB//AAsH4G6pf6po2haxP4c8RLcT+c8N2hASZT/zzY5XI+UlkI6muKtmFGhiIYab96X3Ltd9LvRd2dtHL61fDzxMPhj9772XWy1fZHrvjT9q34M63+zNdfDCw1rUG16XwpDpKwtpkyxm5WBEK+YRtxuU85xXw6eSa7               alt="Awell Brøndboring"
              style={{ height: 42, width: "auto", display: "block" }}
            />
          </div>
          <div className="header-title">
            <h1>{view === "wells" ? "Feltregistrering" : headerTitle}</h1>
            <p>{view === "wells" ? "Boringsdata & Serviceopgaver" : "Awell Brøndboring A/S"}</p>
          </div>
        </div>

        {view === "wells" && (
          <div className="nav">
            {[{ id: "new", icon: "⛏️", label: "Boringer" }, { id: "jupiter", icon: "🌍", label: "Jupiter" }, { id: "tasks", icon: "📋", label: "Opgaver" }, { id: "kort", icon: "🗺️", label: "Kort" }].map(n => (
              <button key={n.id} className={`nav-btn${tab === n.id ? " active" : ""}`} onClick={() => setTab(n.id)}>
                <span>{n.icon}</span>{n.label}
              </button>
            ))}
          </div>
        )}

        {view === "wells" && tab === "new" && renderWells()}
        {view === "wells" && tab === "jupiter" && renderJupiter()}
        {view === "wells" && tab === "tasks" && renderTasks()}
        {view === "wells" && tab === "kort" && renderKort()}
        {view === "editWell" && renderEditWell()}
        {view === "task" && renderTask()}

        {toast && <div className="toast">{toast}</div>}
      </div>
    </>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
