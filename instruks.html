// ─── Helpers ──────────────────────────────────────────────────────────────────
function uid() { return Math.random().toString(36).slice(2, 9); }

function beregnLag(lag, bundpejling) {
  let dybde = parseFloat(bundpejling);
  if (isNaN(dybde)) return lag.map(l => ({ ...l }));
  return [...lag].reverse().map(l => {
    const mat = MATERIALER.find(m => m.id === l.material);
    const dia = parseFloat(l.diaMm);
    const kg  = parseFloat(l.kg);
    if (!mat || isNaN(dia) || dia <= 0 || isNaN(kg) || kg <= 0) {
      return { ...l, fraDybde: null, tilDybde: null, tykkelse: null };
    }
    const r = dia / 2 / 1000;
    const lpm = Math.PI * r * r * 1000;
    const tykkelse = (kg / mat.kgPerL) / lpm;
    const tilDybde = dybde;
    const fraDybde = Math.max(0, dybde - tykkelse);
    dybde = fraDybde;
    return { ...l, fraDybde, tilDybde, tykkelse };
  }).reverse();
}

// ─── Jupiter-kald (samme origin = ingen CORS) ─────────────────────────────────
async function hentJupiter(dguNr) {
  const clean = dguNr.trim().replace(/^DGU\s*/i, "").replace(/\s/g, "");
  // /api/jupiter er på samme domæne (feltdata-v25.vercel.app) – ingen CORS
  const resp = await fetch("/api/jupiter?dgu=" + encodeURIComponent(clean));
  const json = await resp.json();
  if (!resp.ok || json.error) throw new Error(json.error || "Boring ikke fundet");
  const b = json.boring || {};
  return {
    dgu:         clean,
    adresse:     b.adresse  || "",
    kommune:     b.kommune  || "",
    totaldybde:  b.dybde    || "",
    rovandspejl: b.rovandstand      || "",
    forerDia:    b.forerorDiameter  || "",
    forerDybde:  b.forerorDybde     || "",
    filterFra:   "",
    filterTil:   "",
    filterDia:   "",
    borid:       b.boringsid    || "",
    boreholeUrl: b.boreholeUrl  || "",
    pdfUrl:      b.pdfUrl       || "",
  };
}

  defaultTasks.push("Tag dokumentationsbilleder som angivet");

function downloadWord(html, sagsnummer) {
  const blob = new Blob(["\ufeff" + html], { type: "application/msword; charset=utf-8" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href     = url;
  a.download = "Arbejdsinstruks_" + (sagsnummer || "sloejfning") + ".doc";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ─── Boring-kort ──────────────────────────────────────────────────────────────
function BoringKort({ b, i, onChange, onFjern }) {
  const [lader, setLader] = useState(false);
  const [fejl,  setFejl]  = useState(null);
  const upd = (k, v) => onChange({ ...b, [k]: v });

  async function slaa() {
    if (!b.dgu) return;
    setLader(true); setFejl(null);
    try {
      const d = await hentJupiter(b.dgu);
      onChange({
        ...b,
        jupiterOk:   true,
        jupiterAdresse: d.adresse,
        totaldybde:  d.totaldybde  || b.totaldybde,
        rovandspejl: d.rovandspejl || b.rovandspejl,
        forerDia:    d.forerDia    || b.forerDia,
        forerDybde:  d.forerDybde  || b.forerDybde,
        filterFra:   d.filterFra   || b.filterFra,
        filterTil:   d.filterTil   || b.filterTil,
        filterDia:   d.filterDia   || b.filterDia,
        kommune:     d.kommune     || b.kommune,
        boreholeUrl: d.boreholeUrl,
        pdfUrl:      d.pdfUrl,
      });
    } catch (e) { setFejl(e.message); }
    setLader(false);
  }

  const harBoring = b.type !== "brønd";
  const harBrønd  = b.type !== "boring";

  return (
    <div style={{ background: C.blue3, border: "1px solid " + C.blue4,
      borderRadius: 10, padding: 16, marginBottom: 14 }}>

      <div style={{ display: "flex", justifyContent: "space-between",
        alignItems: "center", marginBottom: 12 }}>
        <strong style={{ color: C.blue, fontFamily: "'Montserrat', sans-serif", fontSize: 14 }}>
          {i === 0 ? "Primær boring / brønd" : "Boring " + (i + 1)}
        </strong>
        {i > 0 && <button onClick={onFjern}
          style={{ background: "none", border: "none", cursor: "pointer",
            color: C.red, fontSize: 20, lineHeight: 1 }}>✕</button>}
      </div>

      {/* DGU + Jupiter */}
      <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
        <div style={{ flex: 1 }}>
          <label style={lbl}>DGU nummer</label>
          <input style={inp} placeholder="f.eks. 207.183"
            value={b.dgu} onChange={e => upd("dgu", e.target.value)}
            onKeyDown={e => e.key === "Enter" && slaa()} />
        </div>
        <div style={{ alignSelf: "flex-end" }}>
          <button onClick={slaa} disabled={lader || !b.dgu}
            style={btn(b.jupiterOk ? C.green : C.blue, {
              opacity: lader ? 0.6 : 1, minWidth: 110, padding: "9px 14px" })}>
            {lader ? "Henter…" : b.jupiterOk ? "✓ Jupiter" : "🔍 Jupiter"}
          </button>
        </div>
      </div>

      {fejl && <div style={{ background: "#fde8e8", borderRadius: 6, padding: "7px 12px",
        fontSize: 12, color: C.red, marginBottom: 10,
        border: "1px solid #f5c6c6" }}>{fejl}</div>}

      {b.jupiterOk && <div style={{ background: "#e8f4e8", borderRadius: 6,
        padding: "7px 12px", fontSize: 12, color: C.green, marginBottom: 10,
        border: "1px solid #a8d8a8" }}>
        ✓ Data hentet fra Jupiter
        {b.jupiterAdresse ? " · " + b.jupiterAdresse : ""}
        {b.kommune ? " · " + b.kommune : ""}
        {b.boreholeUrl && <a href={b.boreholeUrl} target="_blank"
          style={{ marginLeft: 10, color: C.blue, fontSize: 11 }}>
          🔗 Borerapport
        </a>}
      </div>}

      {/* Type */}
      <div style={{ marginBottom: 12 }}>
        <label style={lbl}>Type</label>
        <select style={inp} value={b.type} onChange={e => upd("type", e.target.value)}>
          <option value="boring">Boring (forerør + filter)</option>
          <option value="brønd">Brønd / muret brønd</option>
          <option value="boring_med_brønd">Boring med brønd ovenpå</option>
        </select>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 16px" }}>
        <div style={{ marginBottom: 10 }}>
          <label style={lbl}>Bundpejling (m.u.t.)</label>
          <input style={inp} type="number" step="0.01"
            placeholder={b.totaldybde || "f.eks. 34.0"}
            value={b.bundpejling} onChange={e => upd("bundpejling", e.target.value)} />
          {b.totaldybde && !b.bundpejling &&
            <div style={{ fontSize: 10, color: C.text2, marginTop: 2 }}>Jupiter: {b.totaldybde} m</div>}
        </div>
        <div style={{ marginBottom: 10 }}>
          <label style={lbl}>Rovandspejl (m.u.t.)</label>
          <input style={inp} type="number" step="0.01"
            placeholder={b.rovandspejl || ""}
            value={b.rovandspejlFelt} onChange={e => upd("rovandspejlFelt", e.target.value)} />
        </div>

        {harBoring && <>
          <div style={{ marginBottom: 10 }}>
            <label style={lbl}>Forerør indv. Ø (mm)</label>
            <input style={inp} type="number"
              placeholder={b.forerDia || "f.eks. 203"}

          <div style={{ marginBottom: 10 }}>
            <label style={lbl}>Filter Ø (mm)</label>
            <input style={inp} type="number"
              placeholder={b.filterDia || "f.eks. 125"}

          <div style={{ marginBottom: 10 }}>
            <label style={lbl}>Filter fra – til (m.u.t.)</label>

                placeholder={b.filterFra || "fra"}

              <input style={{ ...inp, flex: 1 }} type="number" step="0.01"
                placeholder={b.filterTil || "til"}
                value={b.filterTilFelt} onChange={e => upd("filterTilFelt", e.target.value)} />

          </div>
        </>}

        {harBrønd && <>
          <div style={{ marginBottom: 10 }}>
            <label style={lbl}>Brønd indv. Ø (mm)</label>
            <input style={inp} type="number"
              placeholder="f.eks. 1000"

          <div style={{ marginBottom: 10 }}>

            <input style={inp} type="number" step="0.01"

      <div>
        <label style={lbl}>Bemærkninger til denne boring</label>
        <textarea style={{ ...ta, minHeight: 56 }}
          placeholder="F.eks. artesisk, adgangsforhold, pumpe skal trækkes..."
          value={b.noter} onChange={e => upd("noter", e.target.value)} />

    </div>
  );
}

// ─── Lag-række ────────────────────────────────────────────────────────────────
function LagRaekke({ lag, i, onChange, onFjern, calc }) {
  const upd = (k, v) => onChange({ ...lag, [k]: v });
  const mat = MATERIALER.find(m => m.id === lag.material);
  return (
    <div style={{ background: C.white, border: "1px solid " + C.blue4,
      borderRadius: 8, padding: 14, marginBottom: 10,
      borderLeft: "5px solid " + (mat?.farve || "#ccc") }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
        <span style={{ background: mat?.farve || "#888", color: C.white, borderRadius: "50%",
          width: 26, height: 26, display: "flex", alignItems: "center", justifyContent: "center",
          fontSize: 12, fontWeight: 700, flexShrink: 0 }}>{i + 1}</span>
        <span style={{ fontWeight: 700, color: C.text, flex: 1, fontSize: 13,
          fontFamily: "'Montserrat', sans-serif" }}>{mat?.label || "–"}</span>
        {i > 0 && <button onClick={onFjern}
          style={{ background: "none", border: "none", cursor: "pointer",
            color: C.red, fontSize: 18, lineHeight: 1 }}>✕</button>}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr 1fr", gap: "0 12px" }}>
        <div>
          <label style={lbl}>Materiale</label>
          <select style={inp} value={lag.material} onChange={e => upd("material", e.target.value)}>
            {MATERIALER.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
          </select>
        </div>
        <div>
          <label style={lbl}>Mængde (kg)</label>
          <input style={inp} type="number" step="10"
            value={lag.kg} onChange={e => upd("kg", e.target.value)} placeholder="kg" />
          {mat && <div style={{ fontSize: 10, color: C.text2, marginTop: 2 }}>{mat.kgPerL} kg/L</div>}
        </div>
        <div>
          <label style={lbl}>Ø (mm)</label>
          <input style={inp} type="number" step="1"
            value={lag.diaMm} onChange={e => upd("diaMm", e.target.value)} placeholder="mm" />
        </div>
      </div>
      {calc?.fraDybde != null && (
        <div style={{ marginTop: 8, background: C.blue3, borderRadius: 5,
          padding: "5px 10px", fontSize: 12, color: C.blue, fontWeight: 600 }}>
          📏 {calc.fraDybde.toFixed(2)} – {calc.tilDybde.toFixed(2)} m.u.t.
          &nbsp;·&nbsp; {calc.tykkelse.toFixed(2)} m tykkelse
        </div>
      )}
    </div>
  );
}

// ─── Profil-visualisering ─────────────────────────────────────────────────────
function Profil({ lag, bundpejling }) {
  const maks = parseFloat(bundpejling);
  if (!bundpejling || isNaN(maks) || maks <= 0) return null;
  if (!lag.some(l => l.fraDybde != null)) return null;
  const H = 220;
  return (
    <div style={{ background: C.white, border: "1px solid " + C.blue4,
      borderRadius: 8, padding: 16, marginTop: 16 }}>
      <div style={{ fontFamily: "'Montserrat', sans-serif", fontWeight: 700,
        color: C.blue, fontSize: 13, marginBottom: 12 }}>
        📊 Sløjfningsprofil
      </div>
      <div style={{ display: "flex", gap: 16, alignItems: "flex-end" }}>
        <div style={{ position: "relative", width: 56, height: H,
          background: C.blue3, border: "2px solid " + C.blue4,
          borderRadius: 4, overflow: "hidden", flexShrink: 0 }}>
          <div style={{ position: "absolute", top: 0, left: 0, right: 0, height: 2, background: C.text }} />
          {lag.map((l, i) => {
            if (l.fraDybde == null) return null;
            const mat = MATERIALER.find(m => m.id === l.material);
            return <div key={i} style={{
              position: "absolute", left: 0, right: 0,
              top: (l.fraDybde / maks * H) + "px",
              height: Math.max(l.tykkelse / maks * H, 2) + "px",
              background: mat?.farve || "#ccc",
              borderBottom: "1px solid rgba(0,0,0,0.1)",
            }} />;
          })}
        </div>
        <div style={{ flex: 1 }}>
          {lag.map((l, i) => {
            if (l.fraDybde == null) return null;
            const mat = MATERIALER.find(m => m.id === l.material);
            return <div key={i} style={{ display: "flex", alignItems: "center",
              gap: 8, marginBottom: 5, fontSize: 12 }}>
              <div style={{ width: 14, height: 14, background: mat?.farve || "#ccc",
                borderRadius: 3, flexShrink: 0 }} />
              <span style={{ color: C.text, fontWeight: 600 }}>{mat?.label}</span>
              <span style={{ color: C.text2 }}>
                {l.fraDybde.toFixed(2)}–{l.tilDybde.toFixed(2)} m · {l.kg} kg
              </span>
            </div>;
          })}
        </div>
      </div>
      <div style={{ marginTop: 6, fontSize: 11, color: C.text2,
        display: "flex", justifyContent: "space-between" }}>
        <span>▲ Terræn (0 m)</span><span>▼ {maks} m.u.t.</span>
      </div>
    </div>
  );
}

// ─── Hoved-app ────────────────────────────────────────────────────────────────

    forerDia: "", forerDybde: "",

  };
}
