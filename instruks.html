// ─── Helpers ──────────────────────────────────────────────────────────────────
function uid() { return Math.random().toString(36).slice(2, 9); }

// Beregner volumen i liter for en sektion
function beregnVolumen(diaMm, laengdeM) {
  if (!diaMm || !laengdeM || diaMm <= 0 || laengdeM <= 0) return null;
  const r = diaMm / 2 / 1000; // radius i meter
  return Math.PI * r * r * laengdeM * 1000; // liter
}

// Returnerer diameter (mm) ved en given dybde ud fra forerSections + filterSections
function diaVedDybde(dybde, forerSections, filterSections, brondDybde, brondDia) {
  // Brønd-zone: 0 til brondDybde m.u.t. – bredeste diameter
  if (brondDybde > 0 && brondDia > 0 && dybde <= brondDybde) {
    return brondDia;
  }
  // Forerør og filter-dybder er angivet relativt til boring (ikke brønd+boring).
  // Justér: boring-koordinater starter ved brondDybde m.u.t.
  const boringDybde = dybde - (brondDybde || 0);

  // Check filter (åben kalk / filter-zone)
  for (const fs of (filterSections || [])) {
    if (boringDybde >= fs.fra && boringDybde <= fs.til) return fs.dia;
  }
  // Forerør
  for (const fr of (forerSections || [])) {
    if (boringDybde >= fr.top && boringDybde <= fr.bund) return fr.dia;
  }
  // Fallback: under/over alle kendte sektioner
  const allSections = [
    ...(filterSections || []).map(s => ({ dia: s.dia, bund: s.til })),
    ...(forerSections || []).map(s => ({ dia: s.dia, bund: s.bund })),
  ];
  if (allSections.length > 0) {
    const deepest = allSections.reduce((a, b) => b.bund > a.bund ? b : a);
    if (boringDybde > deepest.bund) return deepest.dia;
    // Over øverste sektion (f.eks. mellem brønd og forerørets top): brug øverste forerør
    const allForer = (forerSections || []);
    if (allForer.length > 0) return allForer[0].dia;
  }
  return null;
}

// Opdeler et lag [fraDybde, tilDybde] i sub-intervaller ved hvert diameter-skift
function splitVedDiaSkift(fraDybde, tilDybde, forerSections, filterSections, brondDybde) {
  // Saml alle breakpoints inden for intervallet – inkl. brønd-/boring-grænse
  const breaks = new Set([fraDybde, tilDybde]);
  // Brønd-grænse: skift fra brønd-diameter til forerørs-diameter
  if (brondDybde > 0 && brondDybde > fraDybde && brondDybde < tilDybde) {
    breaks.add(brondDybde);
  }
  for (const fr of (forerSections || [])) {
    // Forerør-dybder justeres med brondDybde
    const top = fr.top + (brondDybde || 0);
    const bund = fr.bund + (brondDybde || 0);
    if (top > fraDybde && top < tilDybde) breaks.add(top);
    if (fr.bund > fraDybde && fr.bund < tilDybde) breaks.add(fr.bund);
  }
  for (const fs of (filterSections || [])) {
    if (fs.fra > fraDybde && fs.fra < tilDybde) breaks.add(fs.fra);
    if (fs.til > fraDybde && fs.til < tilDybde) breaks.add(fs.til);
  }
  const sorted = Array.from(breaks).sort((a, b) => a - b);
  return sorted.slice(0, -1).map((fra, i) => {
    const til = sorted[i + 1];
    const midDybde = (fra + til) / 2;
    return { fra, til, dia: diaVedDybde(midDybde, forerSections, filterSections) };
  });
}

function beregnLag(lag, bundpejling, primærBoring) {
  let dybde = parseFloat(bundpejling);
  if (isNaN(dybde)) return lag.map(l => ({ ...l, fraDybde: null, tilDybde: null, tykkelse: null, subLag: [] }));

  const forerSections  = primærBoring?.forerSections  || [];
  const filterSections = primærBoring?.filterSections || [];
  const brondDybde     = (primærBoring?.type === "boring_med_brønd")
                          ? (parseFloat(primærBoring?.brondDybde) || 0) : 0;
  const brondDia       = brondDybde > 0
                          ? (parseFloat(primærBoring?.brondDia) || 0) : 0;

  return [...lag].reverse().map(l => {
    const mat = MATERIALER.find(m => m.id === l.material);
    const kg  = parseFloat(l.kg);
    if (!mat || isNaN(kg) || kg <= 0) {
      return { ...l, fraDybde: null, tilDybde: null, tykkelse: null, subLag: [] };
    }

    // Bestem startdiameter (ved nuværende dybde) – inkl. brønd-zone
    const startDia = diaVedDybde(dybde - 0.01, forerSections, filterSections,
                       brondDybde, brondDia)
                  || parseFloat(l.diaMm) || 0;
    if (startDia <= 0) {
      return { ...l, fraDybde: null, tilDybde: null, tykkelse: null, subLag: [],
        diaMm: l.diaMm };
    }

    // Beregn tykkelse ITERATIVT fra bunden og op – diameter skifter undervejs
    // For hvert diameter-interval: beregn hvor mange liter der passer, konverter til meter
    const tilDybde = dybde;
    let restKg = kg;
    let fraDybde = dybde;
    const subLag = [];

    // Find alle diameter-skift-punkter fra dybde og opad mod 0
    // Saml breakpoints: brønd-grænse + forerør-skift + filter-skift
    const allBreaks = new Set();
    if (brondDybde > 0) allBreaks.add(brondDybde);
    (forerSections || []).forEach(fr => {
      const top = fr.top + brondDybde, bund = fr.bund + brondDybde;
      allBreaks.add(top); allBreaks.add(bund);
    });
    (filterSections || []).forEach(fs => {
      const fra = fs.fra + brondDybde, til = fs.til + brondDybde;
      allBreaks.add(fra); allBreaks.add(til);
    });
    allBreaks.add(0);
    // Sortér faldende (dybeste til øverste)
    const breaksSorted = Array.from(allBreaks).filter(b => b <= dybde).sort((a, b) => b - a);

    for (const bpTop of breaksSorted) {
      if (restKg <= 0.001) break;
      const zoneDia = diaVedDybde((fraDybde + bpTop) / 2 + 0.01,
                        forerSections, filterSections, brondDybde, brondDia)
                    || startDia;
      const r = zoneDia / 2 / 1000;
      const lpm = Math.PI * r * r * 1000;
      // Volumen tilgængeligt i dette interval (fra fraDybde ned til bpTop)
      const intervalH = fraDybde - bpTop;
      const maxKgInterval = intervalH * lpm * mat.kgPerL;
      const kgHer = Math.min(restKg, maxKgInterval);
      const hHer = kgHer / (lpm * mat.kgPerL);
      const subTil = fraDybde;
      const subFra = Math.max(bpTop, fraDybde - hHer);
      subLag.unshift({ fra: subFra, til: subTil, dia: zoneDia });
      fraDybde = subFra;
      restKg -= kgHer;
    }
    // Hvis materiale stadig er tilbage (over alle breakpoints), udstræk til 0
    if (restKg > 0.001 && fraDybde > 0) {
      const zoneDia = diaVedDybde(fraDybde / 2, forerSections, filterSections,
                        brondDybde, brondDia) || startDia;
      const r = zoneDia / 2 / 1000;
      const lpm = Math.PI * r * r * 1000;
      const hRest = restKg / (lpm * mat.kgPerL);
      const subFra = Math.max(0, fraDybde - hRest);
      subLag.unshift({ fra: subFra, til: fraDybde, dia: zoneDia });
      fraDybde = subFra;
    }

    fraDybde = Math.max(0, fraDybde);
    const tykkelse = tilDybde - fraDybde;
    dybde = fraDybde;

    // Sammensæt diastreng til visning
    const diasArr = [...new Set(subLag.map(s => s.dia).filter(Boolean))];
    const diaStr  = diasArr.length > 0 ? diasArr.join(" / ") + " mm" : (startDia + " mm");

    return { ...l, fraDybde, tilDybde, tykkelse, diaMm: String(startDia), diaStr, subLag };
  }).reverse();
}

// ─── Jupiter-kald (samme origin = ingen CORS) ─────────────────────────────────
async function hentJupiter(dguNr) {
  const clean = dguNr.trim().replace(/^DGU\s*/i, "").replace(/\s/g, "");
  // /api/jupiter er på samme domæne (feltdata-v25.vercel.app) – ingen CORS
  const resp = await fetch("/api/jupiter?dgu=" + encodeURIComponent(clean));
  const json = await resp.json();
  if (!resp.ok || json.error) throw new Error(json.error || "Boring ikke fundet");
  const b = json.boring || {};
  // Seneste pejling: "3.45 (12-03-2024)"
  const sp = b.senestePejling;
  const rovandMedDato = sp
    ? sp.pejling + (sp.dato ? " (" + sp.dato + ")" : "")
    : b.rovandstand || "";
  return {
    dgu:             clean,
    adresse:         b.adresse  || "",
    kommune:         b.kommune  || "",
    totaldybde:      b.dybde    || "",
    rovandspejl:     rovandMedDato,
    forerDia:        b.forerorDiameter  || "",
    forerBund:       b.forerorBund      || "",
    forerSections:   b.forerorSections  || [],
    filterFra:       b.filterFra        || "",
    filterTil:       b.filterTil        || "",
    filterDia:       b.filterDiameter   || "",
    filterSections:  b.filterSectionsUniq || b.filterSections || [],
    borid:           b.boringsid    || "",
    boreholeUrl:     b.boreholeUrl  || "",
    pdfUrl:          b.pdfUrl       || "",
  };
}

    var rows = '<tr><td class="lbl" colspan="4" style="background:#dce8f5;font-weight:bold;color:#1169b0">Forerør</td></tr>';

    });
    return rows;
  }
  return '<tr><td class="lbl">Forerør Ø (mm)</td><td>' + forerDia + '</td><td class="lbl">Forerør bund (m.u.t.)</td><td>' + forerDybde + '</td></tr>';
}

function wordFilterRows(bo, filterDia, filterFra, filterTil) {
  if (bo.filterSections && bo.filterSections.length > 0) {
    var rows = '<tr><td class="lbl" colspan="4" style="background:#dce8f5;font-weight:bold;color:#1169b0">Filtre</td></tr>';
    bo.filterSections.forEach(function(s) {
      rows += '<tr><td class="lbl">Top – Bund (m.u.t.)</td><td>' + s.fra + ' – ' + s.til + '</td><td class="lbl">Diameter (mm)</td><td>' + s.dia + ' mm</td></tr>';
    });
    return rows;
  }
  return '<tr><td class="lbl">Filter Ø (mm)</td><td>' + filterDia + '</td><td class="lbl">Filter fra – til (m.u.t.)</td><td>' + filterFra + ' – ' + filterTil + '</td></tr>';
}

function buildProfilTabel(lag, bundpejling) {
  const maks = parseFloat(bundpejling) || 1;
  const gyldig = lag.filter(l => l.fraDybde != null);
  if (gyldig.length === 0) return "";
  const matLabel = id => (MATERIALER.find(m => m.id === id) || {}).label || id;
  const matFarve = id => (MATERIALER.find(m => m.id === id) || {}).farve || "#ccc";

  let celler1 = "";
  let celler2 = "";
  gyldig.forEach(l => {
    const pct = ((l.tilDybde - l.fraDybde) / maks * 100).toFixed(1);
    const farve = matFarve(l.material);
    const navn  = (matLabel(l.material) || "").split(" ")[0];
    celler1 += '<td style="background:' + farve + '; height:28pt; width:' + pct + '%; border:1px solid #fff; vertical-align:middle; text-align:center; font-size:8pt; color:#fff; font-weight:bold;">' + navn + "</td>";
    celler2 += '<td style="width:' + pct + '%; font-size:8pt; text-align:center; color:#555; padding:2pt;">' + l.fraDybde.toFixed(1) + "–" + l.tilDybde.toFixed(1) + " m</td>";
  });

  return '<table style="width:100%; border-collapse:collapse; margin-bottom:10pt; font-size:9pt;"><tr>' + celler1 + "</tr><tr>" + celler2 + "</tr></table>";
}

  defaultTasks.push("Aflever vandprøve i firmaet");
  defaultTasks.push("Tag dokumentationsbilleder som angivet");

  return `<html xmlns:o="urn:schemas-microsoft-com:office:office"

  return `
<h3>${i+1}.  DGU ${bo.dgu || "–"}  ·  ${typeLabel(bo.type)}</h3>
<table>
  ${harBoring ? `
  <tr><td class="lbl">Dybde (m.u.t.)</td><td>${dybde}</td><td class="lbl">Seneste pejling (m.u.t.)</td><td>${rovand}</td></tr>
  ${wordForerRows(bo, forerDia, forerDybde)}
  ${wordFilterRows(bo, filterDia, filterFra, filterTil)}
  ` : ""}
  ${harBrønd ? `
  <tr><td class="lbl">Brønd indv. Ø (mm)</td><td>${bo.brondDia || "–"}</td><td class="lbl">Brønd dybde (m.u.t.)</td><td>${bo.brondDybde || "–"}</td></tr>
  ` : ""}
  ${bo.kommune ? `<tr><td class="lbl">Kommune (Jupiter)</td><td colspan="3">${bo.kommune}</td></tr>` : ""}
</table>
${bo.noter ? `<div class="info">ℹ  ${bo.noter.replace(/\n/g, "<br>")}</div>` : ""}`;
}).join("")}

<h2>3.  Sløjfningsprofil og sekvens</h2>
<p>Materialer tilføres i nedenstående rækkefølge – <strong>fra bunden og op</strong>:</p>
${buildProfilTabel(beregnetLag, bundpejling)}
<h2>4.  Opgaven</h2>
<ol>${defaultTasks.map(t => `<li>${t}</li>`).join("")}</ol>

<h2>5.  Materialer og forventet forbrug</h2>
<table>
  <tr><th>Materiale</th><th>Forventet forbrug</th></tr>
  ${Object.entries(aggr).map(([lbl, kg]) => `<tr><td>${lbl}</td><td style="text-align:right">${kg > 0 ? kg + " kg" : "–"}</td></tr>`).join("")}
</table>

${allGrej.length > 0 ? `
<h2>6.  Grej</h2>
<ul>${allGrej.map(e => `<li>${e}</li>`).join("")}</ul>
` : ""}

<h2>${allGrej.length > 0 ? "8" : "7"}.  Dokumentation</h2>
<ul>${(projekt.dokumentation || "").split("\n").filter(Boolean).map(d => `<li>${d.replace(/^[-•]\s*/, "")}</li>`).join("")}</ul>

<p class="footer">Awell Brøndboring A/S  ·  Arbejdsinstruks genereret ${new Date().toLocaleDateString("da-DK")}</p>
</body></html>`;
}

function downloadPdf(projekt, boringer, beregnetLag, grej, friGrej, bundpejling, primær) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });

  const BLUE = [17, 105, 176];
  const DARK = [26, 43, 60];
  const GREY = [77, 98, 120];
  const W = 190; // content width (210 - 10 - 10 margin)
  let y = 15;

  const addPage = () => { doc.addPage(); y = 15; };
  const checkY = (need) => { if (y + need > 280) addPage(); };

  // ── Firmanavn + titel ───────────────────────────────────────────────
  doc.setFontSize(8); doc.setTextColor(...GREY);
  doc.text("Awell Brøndboring A/S", 10, y); y += 5;
  doc.setFontSize(20); doc.setTextColor(...BLUE); doc.setFont("helvetica","bold");
  doc.text("ARBEJDSINSTRUKS – SLØJFNING", 10, y); y += 8;
  doc.setDrawColor(...BLUE); doc.setLineWidth(0.6);
  doc.line(10, y, 200, y); y += 5;
  doc.setFontSize(12); doc.setTextColor(...DARK);
  const titleLine = (projekt.sagsnummer ? projekt.sagsnummer + "  ·  " : "") + (projekt.titel || "Sløjfning");
  doc.text(titleLine, 10, y); y += 8;

  // Artesisk advarsel
  if (projekt.artesisk) {
    doc.setFillColor(253, 232, 232);
    doc.rect(10, y, W, 8, "F");
    doc.setFontSize(9); doc.setTextColor(192, 57, 43); doc.setFont("helvetica","bold");
    doc.text("⚠  ARTESISK BORING – boringen er artesisk (overtryk)", 14, y + 5.5);
    y += 12; doc.setTextColor(...DARK);
  }

  // ── Sektion-header hjælper ──────────────────────────────────────────
  const sektHeader = (title) => {
    checkY(14);
    y += 4;
    doc.setFontSize(12); doc.setFont("helvetica","bold"); doc.setTextColor(...BLUE);
    doc.text(title, 10, y); y += 2;
    doc.setDrawColor(...BLUE); doc.setLineWidth(0.4);
    doc.line(10, y, 200, y); y += 5;
    doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...DARK);
  };

  // Tabel-hjælper (2-kolonne label/værdi)
  const tabel2 = (rows) => {
    rows.forEach(([a, b, c, d]) => {
      checkY(7);
      doc.setFillColor(240, 246, 252);
      doc.rect(10, y-4, 45, 6, "F");
      doc.setFont("helvetica","bold"); doc.text(a, 11, y);
      doc.setFont("helvetica","normal"); doc.text(String(b || "–"), 57, y);
      if (c !== undefined) {
        doc.setFillColor(240, 246, 252);
        doc.rect(105, y-4, 45, 6, "F");
        doc.setFont("helvetica","bold"); doc.text(String(c), 106, y);
        doc.setFont("helvetica","normal"); doc.text(String(d || "–"), 152, y);
      }
      y += 7;
    });
  };

  // ── 1. Opgaveoversigt ────────────────────────────────────────────────
  sektHeader("1.  Opgaveoversigt");
  tabel2([
    ["Sagsnummer", projekt.sagsnummer, "Titel", projekt.titel],
    ["Adresse", projekt.adresse, "", ""],
    ["Kontaktperson", (projekt.kontaktNavn || "") + (projekt.kontaktTlf ? "  ·  " + projekt.kontaktTlf : ""),
     "Grundejer", (projekt.grundejerNavn || "") + (projekt.grundejerTlf ? "  ·  " + projekt.grundejerTlf : "")],
    ["DGU-numre", boringer.map(b => b.dgu).filter(Boolean).join(", "),
     "Dato", projekt.datoFra || "–"],
  ]);

  if (projekt.opgaveBeskrivelse) {
    checkY(8);
    doc.setFont("helvetica","bold"); doc.text("Opgave:", 10, y);
    doc.setFont("helvetica","normal");
    const lines = doc.splitTextToSize(projekt.opgaveBeskrivelse, 150);
    doc.text(lines, 35, y); y += lines.length * 5 + 3;
  }

  // ── 2. Boringer ──────────────────────────────────────────────────────
  sektHeader("2.  Boringer og brønde");
  const typeLabel = t => ({boring:"Boring",brønd:"Brønd",boring_med_brønd:"Boring + brønd"}[t]||t);

  boringer.forEach((bo, i) => {
    checkY(10);
    doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(...BLUE);
    doc.text((i+1) + ".  DGU " + (bo.dgu||"–") + "  ·  " + typeLabel(bo.type), 10, y);
    y += 6; doc.setFontSize(9); doc.setTextColor(...DARK);

    const forerDia = bo.forerDiaFelt || bo.forerDia || "–";
    const forerBund = bo.forerBundFelt || bo.forerBund || "–";
    const rovand = bo.rovandspejlFelt || bo.rovandspejl || "–";
    const dybde = bo.bundpejling || bo.totaldybde || "–";

    if (bo.type !== "brønd") {
      tabel2([
        ["Dybde (m.u.t.)", dybde, "Seneste pejling", rovand],
        ["Forerør Ø (mm)", forerDia, "Forerør bund (m.u.t.)", forerBund],
      ]);
      // Forerør sektioner tabel
      if (bo.forerSections && bo.forerSections.length > 0) {
        checkY(14);
        doc.setFont("helvetica","bold");
        doc.setFillColor(220, 232, 244);
        doc.rect(10, y-4, W, 6, "F");
        doc.text("Forerør – sektioner", 11, y); y += 7;
        doc.setFont("helvetica","normal");
        bo.forerSections.forEach(s => {
          checkY(6);
          const vol = Math.PI * Math.pow(s.dia/2/1000, 2) * (s.bund - s.top) * 1000;
          doc.text(s.top + " – " + s.bund + " m.u.t.", 12, y);
          doc.setFont("helvetica","bold"); doc.text("Ø" + s.dia + " mm", 80, y); doc.setFont("helvetica","normal");
          doc.text(s.materiale || "–", 115, y);
          doc.text(vol.toFixed(1) + " L", 165, y);
          y += 6;
        });
      }
      // Filter sektioner tabel
      if (bo.filterSections && bo.filterSections.length > 0) {
        checkY(14);
        doc.setFont("helvetica","bold");
        doc.setFillColor(220, 232, 244);
        doc.rect(10, y-4, W, 6, "F");
        doc.text("Filtre – sektioner", 11, y); y += 7;
        doc.setFont("helvetica","normal");
        bo.filterSections.forEach(s => {
          checkY(6);
          const vol = Math.PI * Math.pow(s.dia/2/1000, 2) * (s.til - s.fra) * 1000;
          doc.text(s.fra + " – " + s.til + " m.u.t.", 12, y);
          doc.setFont("helvetica","bold"); doc.text("Ø" + s.dia + " mm", 80, y); doc.setFont("helvetica","normal");
          doc.text(s.materiale || "–", 115, y);
          doc.text(vol.toFixed(1) + " L", 165, y);
          y += 6;
        });
      }
    }
    if (bo.type !== "boring") {
      tabel2([["Brønd Ø (mm)", bo.brondDia || "–", "Brønd dybde (m.u.t.)", bo.brondDybde || "–"]]);
    }
    if (bo.noter) {
      checkY(8);
      doc.setFillColor(232, 244, 232);
      const noteLines = doc.splitTextToSize("ℹ  " + bo.noter, W - 8);
      doc.rect(10, y-4, W, noteLines.length * 5 + 4, "F");
      doc.text(noteLines, 14, y); y += noteLines.length * 5 + 5;
    }
    y += 3;
  });

  // ── 3. Sløjfningsprofil + sekvens ────────────────────────────────────
  sektHeader("3.  Sløjfningsprofil og sekvens");

  // Tegn profil med jsPDF
  const gyldig = beregnetLag.filter(l => l.fraDybde != null);
  if (gyldig.length > 0 && bundpejling) {
    const maks = parseFloat(bundpejling);
    const profH = 80; // mm høj
    const profX = 10;
    const profW_max = 25; // mm bred (max = brønd)
    const harBrond = primær.type === "boring_med_brønd" && primær.brondDia > 0;
    const maksDia = harBrond ? parseFloat(primær.brondDia) : 
      Math.max(...(primær.forerSections||[]).map(s=>s.dia), ...(primær.filterSections||[]).map(s=>s.dia), 200);

    checkY(profH + 20);

    // Terræn-linje
    doc.setDrawColor(26,43,60); doc.setLineWidth(1);
    doc.line(profX, y, profX + profW_max + 2, y);

    // Tegn hver underlag
    const matFarver = {
      bentonit_pellets: [107,142,35], bentonit_grout: [139,115,85],
      cementgrout: [169,169,169], filtersand: [232,200,74],
      aertesten: [210,180,140], stabilgrus: [200,184,154],
      brogrus: [184,168,152], muld: [93,64,55], cement_stolpe: [128,128,128]
    };

    gyldig.forEach(l => {
      const subs = l.subLag && l.subLag.length > 0
        ? l.subLag : [{ fra: l.fraDybde, til: l.tilDybde, dia: parseFloat(l.diaMm) || maksDia }];
      const farve = matFarver[l.material] || [180,180,180];
      doc.setFillColor(...farve);
      subs.forEach(s => {
        const subW = Math.max(2, (s.dia / maksDia) * profW_max);
        const subX = profX + (profW_max - subW) / 2;
        const sy = y + (s.fra / maks) * profH;
        const sh = Math.max(0.5, (s.til - s.fra) / maks * profH);
        doc.rect(subX, sy, subW, sh, "F");
      });
    });

    // Ramme rundt om profil
    doc.setDrawColor(...BLUE); doc.setLineWidth(0.3);
    doc.rect(profX, y, profW_max, profH);

    // Dybde-labels til venstre
    doc.setFontSize(7); doc.setTextColor(...GREY);
    [0, 0.25, 0.5, 0.75, 1].forEach(f => {
      const yd = y + f * profH;
      doc.text((f * maks).toFixed(1), profX - 7, yd + 1);
      doc.setDrawColor(200,200,200); doc.setLineWidth(0.1);
      doc.line(profX, yd, profX + profW_max, yd);
    });
    doc.setTextColor(...GREY); doc.setFontSize(7);
    doc.text("m.u.t.", profX - 7, y - 2);

    // Legende til højre
    const legX = profX + profW_max + 6;
    let legY = y + 3;
    doc.setFontSize(8); doc.setTextColor(...DARK);
    gyldig.forEach(l => {
      const farve = matFarver[l.material] || [180,180,180];
      doc.setFillColor(...farve);
      doc.rect(legX, legY - 3, 4, 4, "F");
      doc.setFont("helvetica","bold"); doc.setFontSize(8);
      const matNavn = { bentonit_pellets:"Bentonit pellets", bentonit_grout:"Bentonit grout",
        cementgrout:"Cementgrout", filtersand:"Filtersand", aertesten:"Ærtesten",
        stabilgrus:"Stabilgrus", brogrus:"Brogrus", muld:"Muld", cement_stolpe:"Stolpebeton"
      }[l.material] || l.material;
      doc.text(matNavn, legX + 6, legY);
      doc.setFont("helvetica","normal"); doc.setFontSize(7); doc.setTextColor(...GREY);
      doc.text(l.fraDybde.toFixed(2) + " – " + l.tilDybde.toFixed(2) + " m  ·  " + l.kg + " kg"
        + (l.diaStr ? "  ·  Ø " + l.diaStr : ""), legX + 6, legY + 4);
      doc.setTextColor(...DARK);
      legY += 11;
    });

    y += profH + 8;
  }

  // ── Sekvenstabel ─────────────────────────────────────────────────────
  checkY(20);
  const matNavn2 = { bentonit_pellets:"Bentonit pellets", bentonit_grout:"Bentonit grout",
    cementgrout:"Cementgrout", filtersand:"Filtersand", aertesten:"Ærtesten",
    stabilgrus:"Stabilgrus", brogrus:"Brogrus", muld:"Muld", cement_stolpe:"Stolpebeton" };

  doc.setFillColor(220,232,244);
  doc.rect(10, y-4, W, 6, "F");
  doc.setFont("helvetica","bold"); doc.setFontSize(8.5); doc.setTextColor(...BLUE);
  ["#","Materiale","Fra (m.u.t.)","Til (m.u.t.)","Tykkelse (m)","Mængde (kg)"].forEach((h, i) => {
    const xs = [10,18,85,115,145,170];
    doc.text(h, xs[i], y);
  });
  y += 7;
  doc.setTextColor(...DARK); doc.setFont("helvetica","normal");

  beregnetLag.forEach((l, i) => {
    checkY(7);
    const bg = i % 2 === 0;
    if (!bg) { doc.setFillColor(248,251,254); doc.rect(10, y-4, W, 6, "F"); }
    const matN = matNavn2[l.material] || l.material;
    doc.setFont("helvetica","bold"); doc.text(String(i+1), 11, y); doc.setFont("helvetica","normal");
    doc.text(matN, 18, y);
    doc.text(l.fraDybde != null ? l.fraDybde.toFixed(2) : "–", 85, y);
    doc.text(l.tilDybde != null ? l.tilDybde.toFixed(2) : "–", 115, y);
    doc.text(l.tykkelse != null ? l.tykkelse.toFixed(2) : "–", 145, y);
    doc.setFont("helvetica","bold"); doc.text(String(l.kg || "–"), 170, y);
    y += 7;
  });

  y += 2;
  checkY(7);
  doc.setFillColor(220,232,244);
  doc.rect(10, y-4, W, 6, "F");
  doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(...BLUE);
  doc.text("HUSK: Tilfør vand undervejs efterhånden som bentonit kvæller", 11, y);
  y += 10; doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...DARK);

  // ── 4. Opgaven ────────────────────────────────────────────────────────
  sektHeader("4.  Opgaven");
  const opgaver = [];
  if (projekt.pumpeSkalTraekkes) opgaver.push("Adskil installation og træk pumpe og stigrør");
  opgaver.push("Foretag bundpejling og registrér (m.u.t.)");
  opgaver.push("Foretag rovandspejling og registrér (m.u.t.)");
  opgaver.push("Sløjf boring/brønd med materialer som angivet i sekvensen");
  opgaver.push("Tilfør vand undervejs efterhånden som bentonit kvæller");
  opgaver.push("Nedskær forerør til 1 m.u.t. og retablér terræn");
  opgaver.push("Tag vandprøve – undgå beskidt overfladevand. Skriv DGU-nummer på prøve");
  opgaver.push("Aflever vandprøve i firmaet");
  opgaver.push("Tag dokumentationsbilleder som angivet");
  opgaver.forEach((t, i) => {
    checkY(7);
    doc.text((i+1) + ". " + t, 12, y); y += 6;
  });

  // ── 5. Materialer ─────────────────────────────────────────────────────
  sektHeader("5.  Materialer og forventet forbrug");
  const aggr = {};
  beregnetLag.forEach(l => {
    const n = matNavn2[l.material] || l.material;
    aggr[n] = (aggr[n] || 0) + (parseFloat(l.kg) || 0);
  });
  Object.entries(aggr).forEach(([n, kg]) => {
    checkY(7);
    doc.text(n, 12, y);
    doc.setFont("helvetica","bold"); doc.text(kg + " kg", 160, y);
    doc.setFont("helvetica","normal"); y += 6;
  });

  // ── 6. Grej ───────────────────────────────────────────────────────────
  const allGrej = [...grej, ...friGrej.split("
").map(s=>s.trim()).filter(Boolean)];
  if (allGrej.length > 0) {
    sektHeader("6.  Grej");
    allGrej.forEach(e => {
      checkY(6);
      doc.text("• " + e, 12, y); y += 5;
    });
  }

  // ── 7. Dokumentation ──────────────────────────────────────────────────
  sektHeader(allGrej.length > 0 ? "7.  Dokumentation" : "6.  Dokumentation");
  (projekt.dokumentation || "").split("
").filter(Boolean).forEach(d => {
    checkY(6);
    doc.text("• " + d.replace(/^[-•]\s*/,""), 12, y); y += 5;
  });

  // ── Footer ────────────────────────────────────────────────────────────
  const pageCount = doc.internal.getNumberOfPages();
  for (let i = 1; i <= pageCount; i++) {
    doc.setPage(i);
    doc.setFontSize(8); doc.setTextColor(...GREY);
    doc.setDrawColor(200,200,200); doc.setLineWidth(0.2);
    doc.line(10, 287, 200, 287);
    doc.text("Awell Brøndboring A/S  ·  Arbejdsinstruks genereret " + new Date().toLocaleDateString("da-DK"), 10, 292);
    doc.text("Side " + i + " af " + pageCount, 185, 292);
  }

  // Download
  const sagsnr = projekt.sagsnummer || "sloejfning";
  doc.save("Arbejdsinstruks_" + sagsnr + ".pdf");
}

function downloadWord(html, sagsnummer) {
  const blob = new Blob(["\ufeff" + html], { type: "application/msword; charset=utf-8" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href     = url;
  a.download = "Arbejdsinstruks_" + (sagsnummer || "sloejfning") + ".doc";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ─── Boring-kort ──────────────────────────────────────────────────────────────
function BoringKort({ b, i, onChange, onFjern }) {
  const [lader, setLader] = useState(false);
  const [fejl,  setFejl]  = useState(null);
  const upd = (k, v) => onChange({ ...b, [k]: v });

  async function slaa() {
    if (!b.dgu) return;
    setLader(true); setFejl(null);
    try {
      const d = await hentJupiter(b.dgu);
      onChange({
        ...b,
        jupiterOk:      true,
        jupiterAdresse: d.adresse,
        totaldybde:     d.totaldybde    || b.totaldybde,
        rovandspejl:    d.rovandspejl   || b.rovandspejl,
        forerDia:       d.forerDia      || b.forerDia,
        forerBund:      d.forerBund     || b.forerBund,
        forerSections:  d.forerSections || b.forerSections || [],
        filterFra:      d.filterFra     || b.filterFra,
        filterTil:      d.filterTil     || b.filterTil,
        filterDia:      d.filterDia     || b.filterDia,
        filterSections: d.filterSections || b.filterSections || [],
        kommune:        d.kommune       || b.kommune,
        boreholeUrl:    d.boreholeUrl,
        pdfUrl:         d.pdfUrl,
      });
    } catch (e) { setFejl(e.message); }
    setLader(false);
  }

  const harBoring = b.type !== "brønd";
  const harBrønd  = b.type !== "boring";

  return (
    <div style={{ background: C.blue3, border: "1px solid " + C.blue4,
      borderRadius: 10, padding: 16, marginBottom: 14 }}>

      <div style={{ display: "flex", justifyContent: "space-between",

// ─── Profil-visualisering ─────────────────────────────────────────────────────
function Profil({ lag, bundpejling, forerSections, filterSections, brondDybde, brondDia, type, inline }) {
  const maks = parseFloat(bundpejling);
  if (!bundpejling || isNaN(maks) || maks <= 0) return null;
  if (!lag.some(l => l.fraDybde != null)) return null;

  const H = inline ? 300 : 280;
  const MAXW = 80; // max profil-bredde i px (svarer til største diameter)

  // Brønd-zone øverst (0 til brondDybde m.u.t.) hvis boring_med_brønd
  const harBrond = type === "boring_med_brønd" && brondDybde > 0 && brondDia > 0;

  // Find maks boring-diameter for skalering (UDEN brønd – brønd er altid fuld bredde)
  const boringDias = [
    ...(forerSections || []).map(s => s.dia),
    ...(filterSections || []).map(s => s.dia),
  ].filter(Boolean);
  const maksBoring = boringDias.length > 0 ? Math.max(...boringDias) : 200;
  // Brønd er altid bredere end boring – vis brønd som fuld MAXW, boring proportionalt
  const maksDia = harBrond ? brondDia : maksBoring;

  // Byg liste af alle diameter-zoner til at tegne profil-konturen
  const diaZoner = [];
  if (harBrond) {
    diaZoner.push({ fra: 0, til: brondDybde, dia: brondDia, erBrond: true });
  }
  for (const fr of (forerSections || [])) {
    diaZoner.push({ fra: fr.top + brondDybde, til: fr.bund + brondDybde, dia: fr.dia });
  }
  for (const fs of (filterSections || [])) {
    diaZoner.push({ fra: fs.fra + brondDybde, til: fs.til + brondDybde, dia: fs.dia });
  }
  diaZoner.sort((a, b) => a.fra - b.fra);

  // Bredde i px: brønd = MAXW (fuld), boring skaleres proportionalt relativt til brønd
  const breddePx = (dia) => {
    if (!dia || dia <= 0) return MAXW * 0.2;
    return Math.round(Math.max(4, (dia / maksDia) * MAXW));
  };

  return (
    <div style={{ background: C.white, border: "1px solid " + C.blue4,
      borderRadius: 8, padding: 16, marginTop: inline ? 0 : 16 }}>
      {!inline && <div style={{ fontFamily: "'Montserrat', sans-serif", fontWeight: 700,
        color: C.blue, fontSize: 13, marginBottom: 12 }}>
        📊 Sløjfningsprofil
      </div>}
      <div style={{ display: "flex", gap: 20, alignItems: "flex-start" }}>

        {/* Profil-søjle med varierende bredde */}
        <div style={{ position: "relative", height: H, width: MAXW + 40,
          flexShrink: 0, display: "flex", flexDirection: "column", alignItems: "center" }}>

          {/* Terræn-linje */}
          <div style={{ position: "absolute", top: 0, left: 0, right: 0,
            height: 3, background: C.text, zIndex: 10 }} />

          {/* Tegn diameter-zoner som kontur */}
          <svg width={MAXW + 40} height={H} style={{ position: "absolute", top: 0, left: 0 }}>
            {diaZoner.length === 0 && (
              <rect x={10} y={0} width={MAXW} height={H}
                fill={C.blue3} stroke={C.blue4} strokeWidth={1} />
            )}
            {diaZoner.map((z, i) => {
              const y1 = z.fra / maks * H;
              const y2 = Math.min(z.til / maks * H, H);
              const w  = breddePx(z.dia);
              const x  = Math.round((MAXW + 40 - w) / 2);
              return (
                <rect key={i} x={x} y={y1} width={w} height={y2 - y1}
                  fill={z.erBrond ? "#dceeff" : C.blue3}
                  stroke={z.erBrond ? "#2980b9" : C.blue4}
                  strokeWidth={z.erBrond ? 2 : 1}
                  strokeDasharray={z.erBrond ? "none" : "none"} />
              );
            })}
            {/* Brønd-boring overgang: vandret linje */}
            {harBrond && (
              <line
                x1={0} y1={brondDybde / maks * H}
                x2={MAXW + 40} y2={brondDybde / maks * H}
                stroke="#2980b9" strokeWidth={2} strokeDasharray="5,3" />
            )}
            {/* Diameter-skift linjer */}
            {diaZoner.slice(0, -1).map((z, i) => {
              const y = z.til / maks * H;
              const w1 = breddePx(z.dia);
              const w2 = breddePx(diaZoner[i+1]?.dia);
              const x1 = Math.round((MAXW + 40 - w1) / 2);
              const x2 = Math.round((MAXW + 40 - w2) / 2);
              return (
                <g key={"line"+i}>
                  <line x1={x1} y1={y} x2={x2} y2={y} stroke={C.blue} strokeWidth={1.5} strokeDasharray="4,2" />
                  <line x1={x1+w1} y1={y} x2={x2+w2} y2={y} stroke={C.blue} strokeWidth={1.5} strokeDasharray="4,2" />
                  <text x={MAXW+4} y={y+4} fontSize={9} fill={C.blue}>Ø{diaZoner[i+1]?.dia}</text>
                </g>
              );
            })}
          </svg>

          {/* Lag-farver oven på profil-konturen */}
          {lag.map((l, i) => {
            if (l.fraDybde == null) return null;
            const mat = MATERIALER.find(m => m.id === l.material);
            // Brug subLag til at tegne korrekt bredde pr. sub-interval
            const subs = l.subLag && l.subLag.length > 0 ? l.subLag : [{ fra: l.fraDybde, til: l.tilDybde, dia: parseFloat(l.diaMm) || maksDia }];
            return subs.map((s, si) => {
              const y  = s.fra / maks * H;
              const h2 = Math.max((s.til - s.fra) / maks * H, 1.5);
              const w  = breddePx(s.dia) - 2;
              const x  = Math.round((MAXW + 40 - w) / 2);
              return (
                <div key={i + "-" + si} style={{
                  position: "absolute",
                  top: y + "px", height: Math.max(h2, 2) + "px",
                  left: x + "px", width: w + "px",
                  background: (mat?.farve || "#ccc") + "cc",
                  borderBottom: si < subs.length-1 ? "none" : "1px solid rgba(0,0,0,0.15)",
                  zIndex: 5,
                }} />
              );
            });
          })}

          {/* Dybde-labels */}
          {[0, 0.25, 0.5, 0.75, 1].map(frac => (
            <div key={frac} style={{ position: "absolute", left: 0, top: frac * H - 6,
              fontSize: 9, color: C.text2, width: 24, textAlign: "right" }}>
              {(frac * maks).toFixed(1)}
            </div>
          ))}
        </div>

        {/* Legende */}
        <div style={{ flex: 1, paddingTop: 4 }}>
          {lag.map((l, i) => {
            if (l.fraDybde == null) return null;
            const mat = MATERIALER.find(m => m.id === l.material);
            return <div key={i} style={{ display: "flex", alignItems: "flex-start",
              gap: 8, marginBottom: 7, fontSize: 12 }}>
              <div style={{ width: 14, height: 14, background: mat?.farve || "#ccc",
                borderRadius: 3, flexShrink: 0, marginTop: 1 }} />
              <div>
                <div style={{ color: C.text, fontWeight: 700 }}>{mat?.label}</div>
                <div style={{ color: C.text2, fontSize: 11 }}>
                  {l.fraDybde.toFixed(2)} – {l.tilDybde.toFixed(2)} m.u.t. · {l.kg} kg
                  {l.diaStr && <span> · Ø {l.diaStr}</span>}
                </div>
              </div>
            </div>;
          })}
          {/* Dybdeskala */}
          <div style={{ marginTop: 12, fontSize: 10, color: C.text2,
            borderTop: "1px solid " + C.blue4, paddingTop: 6 }}>
            ▲ 0 m &nbsp;·&nbsp; ▼ {maks} m.u.t.
            {harBrond && <div style={{ color: "#2980b9", fontWeight: 600 }}>
              Brønd: 0–{brondDybde} m.u.t. (Ø{brondDia} mm)
            </div>}
            {forerSections?.length > 0 && <div>
              {forerSections.map((fr, i) =>
                <span key={i} style={{ marginRight: 8 }}>
                  Forerør {fr.top}–{fr.bund} m: Ø{fr.dia} mm
                </span>
              )}
            </div>}
          </div>
        </div>
      </div>
    </div>
  );
}

          <div style={{ background: C.white, borderRadius: 8, padding: "5px 11px",
            fontFamily: "'Montserrat', sans-serif", fontWeight: 900, fontSize: 16,
            color: C.blue, letterSpacing: 1.5 }}>AWELL</div>
        </a>
        <div>
          <div style={{ color: C.white, fontFamily: "'Montserrat', sans-serif",
            fontWeight: 800, fontSize: 15 }}>Arbejdsinstruks Generator</div>
          <div style={{ color: C.blue4, fontSize: 11, marginTop: 1 }}>
            Sløjfning af boringer og brønde
          </div>
        </div>
      </div>

      {/* Tabs */}
      <div style={{ background: C.white, borderBottom: "2px solid " + C.blue4,
        display: "flex", overflowX: "auto" }}>
        {faner.map(f => (
          <button key={f.id} onClick={() => setFane(f.id)}
            style={{ padding: "11px 16px", border: "none", background: "none",
              cursor: "pointer", fontFamily: "'Montserrat', sans-serif",
              fontSize: 13, fontWeight: fane === f.id ? 800 : 500,
              color: fane === f.id ? C.blue : C.text2,
              borderBottom: fane === f.id ? "3px solid " + C.blue : "3px solid transparent",
              marginBottom: -2, whiteSpace: "nowrap" }}>
            {f.label}
          </button>
        ))}
      </div>

      {/* Indhold */}
      <div style={{ maxWidth: 820, margin: "0 auto", padding: "24px 16px 60px" }}>

        {/* ── PROJEKT ─────────────────────────────────────────────────────── */}
        {fane === "projekt" && <>
          <Sekt n="1" title="Projektinformation" icon="📋" />
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 20px" }}>
            <F label="Sagsnummer"><input style={inp} value={projekt.sagsnummer}
              onChange={e => updP("sagsnummer", e.target.value)} placeholder="f.eks. 20710" /></F>
            <F label="Titel / projekt"><input style={inp} value={projekt.titel}
              onChange={e => updP("titel", e.target.value)} placeholder="f.eks. Egedal grundvandspulje" /></F>
          </div>
          <F label="Adresse" col2><input style={inp} value={projekt.adresse}
            onChange={e => updP("adresse", e.target.value)}
            placeholder="f.eks. Hagerupvej 7b, 3650 Ølstykke" /></F>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 20px" }}>
            <F label="Dato fra"><input style={inp} type="date" value={projekt.datoFra}
              onChange={e => updP("datoFra", e.target.value)} /></F>
            <F label="Dato til"><input style={inp} type="date" value={projekt.datoTil}
              onChange={e => updP("datoTil", e.target.value)} /></F>
            <F label="Kontaktperson navn"><input style={inp} value={projekt.kontaktNavn}
              onChange={e => updP("kontaktNavn", e.target.value)} /></F>
            <F label="Kontaktperson tlf"><input style={inp} value={projekt.kontaktTlf}
              onChange={e => updP("kontaktTlf", e.target.value)} placeholder="93 89 89 04" /></F>
            <F label="Grundejer navn"><input style={inp} value={projekt.grundejerNavn}
              onChange={e => updP("grundejerNavn", e.target.value)} /></F>
            <F label="Grundejer tlf"><input style={inp} value={projekt.grundejerTlf}
              onChange={e => updP("grundejerTlf", e.target.value)} /></F>
          </div>
          <div style={{ display: "flex", gap: 24, margin: "12px 0 16px",
            padding: "12px 16px", background: "#fff8e1", borderRadius: 8,
            border: "1px solid #ffe082" }}>
            <label style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer",
              fontSize: 13, fontWeight: 700,
              color: projekt.artesisk ? C.red : C.text }}>
              <input type="checkbox" checked={projekt.artesisk}
                onChange={e => updP("artesisk", e.target.checked)} />
              ⚠️ Artesisk boring
            </label>
            <label style={{ display: "flex", alignItems: "center", gap: 8,
              cursor: "pointer", fontSize: 13, fontWeight: 700, color: C.text }}>
              <input type="checkbox" checked={projekt.pumpeSkalTraekkes}
                onChange={e => updP("pumpeSkalTraekkes", e.target.checked)} />
              Pumpe skal trækkes
            </label>
          </div>
          <F label="Opgavebeskrivelse" col2>
            <textarea style={{ ...ta, minHeight: 80 }} value={projekt.opgaveBeskrivelse}
              onChange={e => updP("opgaveBeskrivelse", e.target.value)}
              placeholder="Kort beskrivelse..." />
          </F>
          <F label="Særlige hensyn / adgangsforhold" col2>
            <textarea style={ta} value={projekt.specialHensyn}
              onChange={e => updP("specialHensyn", e.target.value)}
              placeholder="Smal kørevej, boring under tag, besøgstider..." />
          </F>
          <F label="Dokumentationskrav (ét krav pr. linje)" col2>
            <textarea style={ta} value={projekt.dokumentation}
              onChange={e => updP("dokumentation", e.target.value)} />
          </F>
          <button style={btn()} onClick={() => setFane("boringer")}>
            Næste: Boringer →
          </button>
        </>}

        {/* ── BORINGER ────────────────────────────────────────────────────── */}
        {fane === "boringer" && <>
          <Sekt n="2" title="Boringer og brønde" icon="⛏️" />
          <p style={{ fontSize: 13, color: C.text2, marginBottom: 18, lineHeight: 1.6 }}>
            Angiv boringer/brønde der skal sløjfes. Brug <strong>🔍 Jupiter</strong>-knappen
            til at hente dimensionsdata automatisk fra GEUS.
          </p>
          {boringer.map((b, i) => (
            <BoringKort key={b.id} b={b} i={i}
              onChange={upd => setBoringer(prev => prev.map((x, j) => j === i ? upd : x))}
              onFjern={() => setBoringer(prev => prev.filter((_, j) => j !== i))} />
          ))}
          <div style={{ display: "flex", gap: 12, marginTop: 4 }}>
            <button style={btn("#34495e")}
              onClick={() => setBoringer(prev => [...prev, nyBoring()])}>
              + Tilføj boring / brønd
            </button>
            <button style={{ ...btn(), marginLeft: "auto" }}
              onClick={() => setFane("sloejfning")}>
              Næste: Sløjfning →
            </button>
          </div>
        </>}

        {/* ── SLØJFNING ───────────────────────────────────────────────────── */}
        {fane === "sloejfning" && <>
          <Sekt n="3" title="Sløjfningssekvens og materialer" icon="🪣" />
          <p style={{ fontSize: 13, color: C.text2, marginBottom: 10, lineHeight: 1.6 }}>
            Angiv materialer <strong>fra bunden og op</strong> (lag 1 = nederst).
            Dybder beregnes automatisk ud fra bundpejling og diameter.
          </p>
          {!bundpejling && (
            <div style={{ background: "#fff8e1", border: "1px solid #ffe082",
              borderRadius: 8, padding: "10px 14px", fontSize: 13,
              color: "#8d6e00", marginBottom: 14 }}>
              💡 Angiv bundpejling på den primære boring for automatisk dybdeberegning.
            </div>
          )}
          {beregnetLag.map((l, i) => (
            <LagRaekke key={l.id} lag={l} i={i} calc={beregnetLag[i]}
              onChange={upd => setLag(prev => prev.map((x, j) => j === i ? upd : x))}
              onFjern={() => setLag(prev => prev.filter((_, j) => j !== i))} />
          ))}
          <button style={btn("#34495e", { marginBottom: 16 })}
            onClick={() => setLag(prev => [
              { id: uid(), material: "stabilgrus", kg: "", diaMm: "" },
              ...prev
            ])}>
            + Tilføj lag (øverst)
          </button>
          <Profil lag={beregnetLag} bundpejling={bundpejling}
            forerSections={primær.forerSections}
            filterSections={primær.filterSections}
            brondDybde={brondDybde}
            brondDia={parseFloat(primær.brondDia) || 0}
            type={primær.type} />
          <div style={{ marginTop: 16 }}>
            <button style={btn()} onClick={() => setFane("grej")}>
              Næste: Grej →
            </button>
          </div>
        </>}

        {/* ── GREJ ────────────────────────────────────────────────────────── */}
        {fane === "grej" && <>
          <Sekt n="4" title="Grej og udstyr" icon="🔧" />
          {GREJ_KATEGORIER.map(kat => (
            <div key={kat.label} style={{ marginBottom: 20 }}>
              <div style={{ fontFamily: "'Montserrat', sans-serif", fontWeight: 700,
                fontSize: 13, color: C.blue, marginBottom: 8,
                borderBottom: "1px solid " + C.blue4, paddingBottom: 4 }}>
                {kat.label}
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6 }}>
                {kat.items.map(e => {
                  const aktiv = grej.includes(e);
                  return (
                    <label key={e} style={{ display: "flex", alignItems: "center", gap: 8,
                      padding: "7px 12px", border: "1px solid " + (aktiv ? C.blue : C.blue4),
                      borderRadius: 7, cursor: "pointer",
                      background: aktiv ? C.blue3 : C.white,
                      fontSize: 12, fontWeight: aktiv ? 700 : 400 }}>
                      <input type="checkbox" checked={aktiv} onChange={() =>
                        setGrej(prev => aktiv ? prev.filter(x => x !== e) : [...prev, e])} />
                      {e}
                    </label>
                  );
                })}
              </div>
            </div>
          ))}
          <F label="Fritekst-grej (ét styk pr. linje)" col2>
            <textarea style={ta} value={friGrej}
              onChange={e => setFriGrej(e.target.value)}
              placeholder="F.eks. 2 bigbags bentonit pellets á 500 kg..." />
          </F>
          <button style={btn()} onClick={() => setFane("materialer")}>
            Næste: Materialer →
          </button>
        </>}

        {/* ── MATERIALER ──────────────────────────────────────────────────── */}
        {fane === "materialer" && <>
          <Sekt n="5" title="Materialer" icon="🪣" />
          <p style={{ fontSize: 13, color: C.text2, marginBottom: 18, lineHeight: 1.6 }}>
            Opsummering af sløjfningsmaterialer fra sløjfningssekvensen.
            Justér mængderne efter behov.
          </p>
          {(() => {
            const matLabel = id => (MATERIALER.find(m => m.id === id) || {}).label || id;
            const aggr = {};
            beregnetLag.forEach(l => {
              if (!l.kg || parseFloat(l.kg) <= 0) return;
              aggr[l.material] = (aggr[l.material] || 0) + (parseFloat(l.kg) || 0);
            });
            const entries = Object.entries(aggr);
            if (entries.length === 0) return (
              <div style={{ background: "#fff8e1", border: "1px solid #ffe082",
                borderRadius: 8, padding: "12px 16px", fontSize: 13, color: "#8d6e00" }}>
                💡 Ingen materialer endnu – gå til fanebladet "Sløjfning" og tilføj lag med mængder.
              </div>
            );
            return (
              <div style={{ background: C.white, border: "1px solid " + C.blue4,
                borderRadius: 10, overflow: "hidden" }}>
                {entries.map(([matId, totalKg], i) => {
                  const mat = MATERIALER.find(m => m.id === matId);
                  return (
                    <div key={matId} style={{
                      display: "flex", alignItems: "center", gap: 14,
                      padding: "13px 16px",
                      borderBottom: i < entries.length - 1 ? "1px solid " + C.blue4 : "none",
                      background: i % 2 === 0 ? C.white : C.blue3,
                    }}>
                      <div style={{ width: 14, height: 14, borderRadius: 3, flexShrink: 0,
                        background: mat?.farve || "#ccc" }} />
                      <div style={{ flex: 1, fontWeight: 600, fontSize: 14 }}>
                        {matLabel(matId)}
                      </div>
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <input
                          type="number" step="10" min="0"
                          value={totalKg}
                          onChange={e => {
                            const nyKg = parseFloat(e.target.value) || 0;
                            // Fordel ny totalKg proportionalt på lag med dette materiale
                            const lagsIndex = beregnetLag.reduce((acc, l, idx) => {
                              if (l.material === matId && parseFloat(l.kg) > 0) acc.push(idx);
                              return acc;
                            }, []);
                            if (lagsIndex.length === 1) {
                              setLag(prev => prev.map((l, idx) =>
                                idx === lagsIndex[0] ? { ...l, kg: String(nyKg) } : l
                              ));
                            }
                          }}
                          style={{ ...inp, width: 100, textAlign: "right",
                            fontWeight: 700, fontSize: 15 }}
                        />
                        <span style={{ color: C.text2, fontSize: 13, width: 24 }}>kg</span>
                      </div>
                    </div>
                  );
                })}
                <div style={{ padding: "12px 16px", borderTop: "2px solid " + C.blue,
                  display: "flex", justifyContent: "space-between",
                  fontFamily: "'Montserrat', sans-serif", fontWeight: 800 }}>
                  <span>Total</span>
                  <span>{Object.values(aggr).reduce((s, v) => s + v, 0).toFixed(0)} kg</span>
                </div>
              </div>
            );
          })()}
          <div style={{ marginTop: 20 }}>
            <button style={btn()} onClick={() => setFane("generer")}>
              Næste: Generer →
            </button>
          </div>
        </>}

        {/* ── GENERER ─────────────────────────────────────────────────────── */}
        {fane === "generer" && <>
          <Sekt n="6" title="Generer arbejdsinstruks" icon="📄" />

          {/* Opsummering */}
          <div style={{ background: C.white, border: "1px solid " + C.blue4,
            borderRadius: 10, padding: 20, marginBottom: 20 }}>
            <div style={{ fontFamily: "'Montserrat', sans-serif", fontWeight: 800,
              fontSize: 16, color: C.blue, borderBottom: "2px solid " + C.blue,
              paddingBottom: 8, marginBottom: 12 }}>
              ARBEJDSINSTRUKS – SLØJFNING
            </div>
            <table style={{ width: "100%", fontSize: 13, borderCollapse: "collapse" }}>
              <tbody>
                {[
                  ["Sagsnummer", projekt.sagsnummer || "–"],
                  ["Adresse", projekt.adresse || "–"],
                  ["Kontakt", (projekt.kontaktNavn || "–") + (projekt.kontaktTlf ? " · " + projekt.kontaktTlf : "")],
                  ["Boringer", boringer.map(b => b.dgu || "ingen DGU").join(", ")],
                  ["Sløjfningslag", beregnetLag.length + " lag · " + beregnetLag.reduce((s, l) => s + (parseFloat(l.kg) || 0), 0) + " kg total"],
                  ["Grej", (grej.length + friGrej.split("\n").filter(Boolean).length) + " poster"],
                ].map(([k, v]) => (
                  <tr key={k}>
                    <td style={{ padding: "4px 0", color: C.text2, width: 130, fontSize: 12 }}>{k}</td>
                    <td style={{ padding: "4px 0", fontWeight: 600 }}>{v}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          <div style={{ display: "flex", gap: 12, marginBottom: 4 }}>
            <button onClick={download}
              style={{ ...btn(), flex: 1, padding: 14, fontSize: 14 }}>
              📄 Word (.doc)
            </button>
            <button onClick={() => downloadPdf(projekt, boringer, beregnetLag, grej, friGrej, bundpejling, primær)}
              style={{ ...btn("#E8500A"), flex: 1, padding: 14, fontSize: 14,
                boxShadow: "0 3px 12px rgba(232,80,10,0.3)" }}>
              📑 PDF
            </button>
          </div>
          <p style={{ fontSize: 12, color: C.text2, textAlign: "center", marginTop: 4 }}>
            PDF inkluderer sløjfningsprofil · Word åbnes i Microsoft Word
          </p>
        </>}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
