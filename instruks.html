<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Awell – Arbejdsinstruks</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { background: #dce8f5; font-family: 'Open Sans', Arial, sans-serif; }
  </style>
  <!-- jsPDF for PDF generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script>

function genererAttest(projekt, primær, beregnetLag, attest) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
  const BLUE = [17, 105, 176], DARK = [26, 43, 60], GREY = [77, 98, 120];
  const W = 190;
  let y = 15;

  const checkY = (n) => { if (y + n > 280) { doc.addPage(); y = 15; } };

  const matFarver = {
    bentonit_pellets:[107,142,35], bentonit_grout:[139,115,85],
    cementgrout:[169,169,169], filtersand:[232,200,74],
    aertesten:[210,180,140], stabilgrus:[200,184,154],
    brogrus:[184,168,152], muld:[93,64,55], cement_stolpe:[128,128,128]
  };
  const matNavn = {
    bentonit_pellets:"Bentonit pellets", bentonit_grout:"Bentonit grout",
    cementgrout:"Cementgrout", filtersand:"Filtersand", aertesten:"Ærtesten",
    stabilgrus:"Stabilgrus", brogrus:"Brogrus", muld:"Muld", cement_stolpe:"Stolpebeton"
  };
  function getFarve(mat) {
    for (var k in matFarver) if (mat && mat.toLowerCase().includes(k.replace("_"," "))) return matFarver[k];
    return [180,180,180];
  }

  // ── HEADER ────────────────────────────────────────────────────────────────
  doc.setFillColor(...BLUE); doc.rect(0, 0, 210, 22, "F");
  doc.setFontSize(16); doc.setFont("helvetica","bold"); doc.setTextColor(255,255,255);
  doc.text("SLØJFNINGSATTEST", 10, 14);
  doc.setFontSize(9); doc.setFont("helvetica","normal");
  doc.text("Awell Brøndboring A/S", 145, 10);
  if (projekt.sagsnummer) doc.text("Sag: " + projekt.sagsnummer, 145, 16);
  y = 28;

  // ── 1. PROJEKTINFO + BORINGSKONSTRUKTION side om side ─────────────────────
  doc.setFontSize(11); doc.setFont("helvetica","bold"); doc.setTextColor(...DARK);
  doc.text("Projekt og boringskonstruktion", 10, y); y += 5;
  doc.setLineWidth(0.4); doc.setDrawColor(...BLUE); doc.line(10, y, 200, y); y += 4;

  var col1 = [
    ["Projektnummer", projekt.sagsnummer || "–"],
    ["Projektnavn",   projekt.titel || "–"],
    ["Adresse",       projekt.adresse || "–"],
    ["Klient",        projekt.grundejerNavn || "–"],
  ];
  var bundpejlingVal = attest.bundpejling || (primær.bundpejling || primær.totaldybde || "–");
  var forerDiaVal    = attest.forerDia    || (primær.forerSections && primær.forerSections[0] ? primær.forerSections[0].dia : "–");
  var forerTopVal    = attest.forerTop    || (primær.forerSections && primær.forerSections[0] ? primær.forerSections[0].top : "–");
  var col2 = [
    ["DGU nr.",         primær.dgu || "–"],
    ["Forerør Ø (mm)",  forerDiaVal + " mm"],
    ["Forerør top",     forerTopVal + " m u. terræn"],
    ["Bundpejling",     bundpejlingVal + " m u. terræn"],
    ["Rovandspejl",     (attest.rovandspejl || primær.rovandspejl || "–") + " m u. terræn"],
    ["Pejledato",       attest.pejledato || "–"],
    ["Sløjfning udført",attest.dato || "–"],
    ["Udført af",       attest.udfoertAf || "–"],
  ];

  doc.setFont("helvetica","normal"); doc.setFontSize(8.5);
  var startY = y;
  col1.forEach(function(r) {
    checkY(7);
    doc.setFillColor(240,246,252); doc.rect(10, y-4, 42, 6, "F");
    doc.setFont("helvetica","bold"); doc.setTextColor(...GREY); doc.text(r[0], 11, y);
    doc.setFont("helvetica","normal"); doc.setTextColor(...DARK); doc.text(String(r[1]), 54, y);
    y += 7;
  });
  var y2 = startY;
  col2.forEach(function(r) {
    doc.setFillColor(240,246,252); doc.rect(106, y2-4, 42, 6, "F");
    doc.setFont("helvetica","bold"); doc.setTextColor(...GREY); doc.text(r[0], 107, y2);
    doc.setFont("helvetica","normal"); doc.setTextColor(...DARK); doc.text(String(r[1]), 150, y2);
    y2 += 7;
  });
  y = Math.max(y, y2) + 4;

  // ── 2. SLØJFNINGSPROFIL + TABEL side om side ──────────────────────────────
  checkY(100);
  doc.setFontSize(11); doc.setFont("helvetica","bold"); doc.setTextColor(...DARK);
  doc.text("Sløjfningsprofil og mængder", 10, y); y += 5;
  doc.setLineWidth(0.4); doc.setDrawColor(...BLUE); doc.line(10, y, 200, y); y += 4;

  var faktLag = attest.faktiskeLag.length > 0
    ? attest.faktiskeLag
    : beregnetLag.filter(function(l){return l.fraDybde != null;}).map(function(l){
        return { materiale: matNavn[l.material]||l.material,
          fraM: l.fraDybde.toFixed(2), tilM: l.tilDybde.toFixed(2),
          teoretiskKg: l.kg||"", faktiskKg: "" };
      });

  var profH = Math.min(100, faktLag.length * 15 + 10);
  var maksMut = parseFloat(bundpejlingVal) || 0;
  faktLag.forEach(function(l){ var v=parseFloat(l.tilM)||0; if(v>maksMut) maksMut=v; });

  // Profil-søjle
  var profX = 10, profW = 22;
  if (maksMut > 0) {
    // Terræn
    doc.setDrawColor(...DARK); doc.setLineWidth(1.5);
    doc.line(profX, y, profX + profW, y);
    faktLag.forEach(function(l) {
      var fra = parseFloat(l.fraM)||0, til = parseFloat(l.tilM)||fra;
      var y1 = y + (fra/maksMut)*profH;
      var y2 = Math.min(y + (til/maksMut)*profH, y + profH);
      var farve = getFarve(l.materiale);
      doc.setFillColor(farve[0], farve[1], farve[2]);
      doc.rect(profX, y1, profW, y2-y1, "F");
      doc.setDrawColor(180,180,180); doc.setLineWidth(0.2);
      doc.rect(profX, y1, profW, y2-y1);
    });
    // Dybde-labels
    doc.setFontSize(7); doc.setTextColor(...GREY);
    [0, 0.25, 0.5, 0.75, 1].forEach(function(f){
      var yd = y + f*profH;
      doc.text((f*maksMut).toFixed(1), profX-1, yd+1, {align:"right"});
      doc.setDrawColor(210,210,210); doc.setLineWidth(0.1);
      doc.line(profX, yd, profX+profW, yd);
    });
    doc.setFontSize(7); doc.setTextColor(...GREY);
    doc.text("m.u.t.", profX-1, y-2, {align:"right"});
    doc.setDrawColor(...BLUE); doc.setLineWidth(0.3);
    doc.rect(profX, y, profW, profH);
  }

  // Tabel ved siden af profil
  var tabX = profX + profW + 6;
  var tabW = W - profW - 6;
  // Header
  doc.setFillColor(...[220,232,244]);
  doc.rect(tabX, y-4, tabW, 8, "F");
  doc.setFont("helvetica","bold"); doc.setFontSize(7.5); doc.setTextColor(...BLUE);
  var cols = [tabX, tabX+40, tabX+60, tabX+80, tabX+100, tabX+120];
  ["Materiale","Fra","Til","Teor. kg","Fakt. kg","Forskel"].forEach(function(h,i){
    doc.text(h, cols[i]+1, y);
  });
  var rowY = y + 8;
  doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(...DARK);
  faktLag.forEach(function(l, i) {
    var rowH2 = 7;
    if (i%2===1){ doc.setFillColor(248,251,254); doc.rect(tabX, rowY-4, tabW, rowH2, "F"); }
    var farve = getFarve(l.materiale);
    doc.setFillColor(farve[0],farve[1],farve[2]); doc.rect(tabX, rowY-4, 2, rowH2, "F");
    doc.setTextColor(...DARK);
    doc.text(l.materiale||"–", cols[0]+3, rowY);
    doc.text(l.fraM||"–", cols[1]+1, rowY);
    doc.text(l.tilM||"–", cols[2]+1, rowY);
    doc.setFont("helvetica","bold");
    doc.text(l.teoretiskKg ? l.teoretiskKg+" kg" : "–", cols[3]+1, rowY);
    doc.setFont("helvetica","normal");
    doc.text(l.faktiskKg ? l.faktiskKg+" kg" : "–", cols[4]+1, rowY);
    // Forskel
    var teor = parseFloat(l.teoretiskKg), fakt = parseFloat(l.faktiskKg);
    if (!isNaN(teor) && !isNaN(fakt)) {
      var diff = fakt - teor;
      if (diff > 0) { doc.setTextColor(39, 174, 96); }
      else if (diff < 0) { doc.setTextColor(192, 57, 57); }
      else { doc.setTextColor(100, 100, 100); }
      doc.text((diff>0?"+":"") + diff.toFixed(1)+" kg", cols[5]+1, rowY);
      doc.setTextColor(...DARK);
    }
    rowY += rowH2;
  });

  // Total
  var totTeor = faktLag.reduce(function(s,l){return s+(parseFloat(l.teoretiskKg)||0);},0);
  var totFakt = faktLag.reduce(function(s,l){return s+(parseFloat(l.faktiskKg)||0);},0);
  doc.setFillColor(...[220,232,244]);
  doc.rect(tabX, rowY-4, tabW, 7, "F");
  doc.setFont("helvetica","bold"); doc.setFontSize(8.5); doc.setTextColor(...BLUE);
  doc.text("TOTAL", cols[0]+3, rowY);
  doc.text(totTeor.toFixed(1)+" kg", cols[3]+1, rowY);
  if (totFakt > 0) {
    doc.text(totFakt.toFixed(1)+" kg", cols[4]+1, rowY);
    var totDiff = totFakt-totTeor;
    if (totDiff > 0) { doc.setTextColor(39, 174, 96); }
    else if (totDiff < 0) { doc.setTextColor(192, 57, 57); }
    else { doc.setTextColor(100, 100, 100); }
    doc.text((totDiff>0?"+":"") + totDiff.toFixed(1)+" kg", cols[5]+1, rowY);
  }

  y = Math.max(y + profH, rowY) + 10;

  // ── 3. CEMENTGROUT STØBEDATA ──────────────────────────────────────────────
  var harCement = beregnetLag.some(function(l){return l.material==="cementgrout"||l.material==="cement_stolpe";});
  if (harCement && (attest.antalBlandinger || attest.cementKg)) {
    checkY(50);
    doc.setFontSize(11); doc.setFont("helvetica","bold"); doc.setTextColor(...DARK);
    doc.text("Cementgrout støbedata", 10, y); y += 5;
    doc.setLineWidth(0.4); doc.setDrawColor(...BLUE); doc.line(10, y, 200, y); y += 6;
    var cData = [
      ["Antal blandinger total", (attest.antalBlandinger||"–") + " stk"],
      ["Vol. per blanding",      (attest.volPerBlanding||"–") + " L"],
      ["Total vol. nedpumpet",   attest.antalBlandinger && attest.volPerBlanding
        ? (parseFloat(attest.antalBlandinger)*parseFloat(attest.volPerBlanding)).toFixed(0)+" L" : "–"],
      ["Kontrolrumvægt",         (attest.kontrolRumvaegt||"–") + " g/cm³"],
      ["Cementforbrug total",    (attest.cementKg||"–") + " kg"],
      ["Bentonitforbrug",        (attest.bentonitKg||"–") + " kg"],
    ];
    doc.setFont("helvetica","normal"); doc.setFontSize(8.5);
    cData.forEach(function(r,i) {
      var cx = i < 3 ? 10 : 105;
      var cy = i < 3 ? y + i*8 : y + (i-3)*8;
      doc.setFillColor(240,246,252); doc.rect(cx, cy-4, 40, 6, "F");
      doc.setFont("helvetica","bold"); doc.setTextColor(...GREY); doc.text(r[0], cx+1, cy);
      doc.setFont("helvetica","normal"); doc.setTextColor(...DARK); doc.text(r[1], cx+42, cy);
    });
    y += Math.ceil(cData.length/2)*8 + 8;
  }

  // ── 4. NOTER ──────────────────────────────────────────────────────────────
  if (attest.noter) {
    checkY(20);
    doc.setFontSize(10); doc.setFont("helvetica","bold"); doc.setTextColor(...DARK);
    doc.text("Noter til sløjfningsarbejdet", 10, y); y += 6;
    doc.setFont("helvetica","normal"); doc.setFontSize(8.5);
    var noterLines = doc.splitTextToSize(attest.noter, W);
    doc.text(noterLines, 10, y); y += noterLines.length * 5 + 6;
  }

  // ── FOOTER ────────────────────────────────────────────────────────────────
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFontSize(7.5); doc.setTextColor(...GREY);
    doc.setDrawColor(200,200,200); doc.setLineWidth(0.2); doc.line(10, 287, 200, 287);
    doc.text("Awell Brøndboring A/S  ·  Sløjfningsattest  ·  " + new Date().toLocaleDateString("da-DK"), 10, 292);
    doc.text("Side " + p + " af " + pages, 185, 292);
  }

  var sagsnr = projekt.sagsnummer || "attest";
  var dgu = primær.dgu || "";
  doc.save("Sloejfningsattest_" + sagsnr + (dgu ? "_" + dgu.replace(".","_") : "") + ".pdf");
}


function downloadPdf(projekt, boringer, beregnetLag, grej, friGrej, bundpejling, primær) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });

  const BLUE = [17, 105, 176];
  const DARK = [26, 43, 60];
  const GREY = [77, 98, 120];
  const W = 190; // content width (210 - 10 - 10 margin)
  let y = 15;

  const addPage = () => { doc.addPage(); y = 15; };
  const checkY = (need) => { if (y + need > 280) addPage(); };

  // ── Firmanavn + titel ───────────────────────────────────────────────
  doc.setFontSize(8); doc.setTextColor(...GREY);
  doc.text("Awell Brøndboring A/S", 10, y); y += 5;
  doc.setFontSize(20); doc.setTextColor(...BLUE); doc.setFont("helvetica","bold");
  doc.text("ARBEJDSINSTRUKS – SLØJFNING", 10, y); y += 8;
  doc.setDrawColor(...BLUE); doc.setLineWidth(0.6);
  doc.line(10, y, 200, y); y += 5;
  doc.setFontSize(12); doc.setTextColor(...DARK);
  const titleLine = (projekt.sagsnummer ? projekt.sagsnummer + "  ·  " : "") + (projekt.titel || "Sløjfning");
  doc.text(titleLine, 10, y); y += 8;

  // Artesisk advarsel
  if (projekt.artesisk || boringer.some(b => b.artesisk)) {
    doc.setFillColor(253, 232, 232);
    doc.rect(10, y, W, 8, "F");
    doc.setFontSize(9); doc.setTextColor(192, 57, 43); doc.setFont("helvetica","bold");
    doc.text("⚠  ARTESISK BORING – boringen er artesisk (overtryk)", 14, y + 5.5);
    y += 12; doc.setTextColor(...DARK);
  }

  // ── Sektion-header hjælper ──────────────────────────────────────────
  const sektHeader = (title) => {
    checkY(14);
    y += 4;
    doc.setFontSize(12); doc.setFont("helvetica","bold"); doc.setTextColor(...BLUE);
    doc.text(title, 10, y); y += 2;
    doc.setDrawColor(...BLUE); doc.setLineWidth(0.4);
    doc.line(10, y, 200, y); y += 5;
    doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...DARK);
  };

  // Tabel-hjælper (2-kolonne label/værdi)
  const tabel2 = (rows) => {
    rows.forEach(([a, b, c, d]) => {
      checkY(7);
      doc.setFillColor(240, 246, 252);
      doc.rect(10, y-4, 45, 6, "F");
      doc.setFont("helvetica","bold"); doc.text(a, 11, y);
      doc.setFont("helvetica","normal"); doc.text(String(b || "–"), 57, y);
      if (c !== undefined) {
        doc.setFillColor(240, 246, 252);
        doc.rect(105, y-4, 45, 6, "F");
        doc.setFont("helvetica","bold"); doc.text(String(c), 106, y);
        doc.setFont("helvetica","normal"); doc.text(String(d || "–"), 152, y);
      }
      y += 7;
    });
  };

  // ── 1. Opgaveoversigt ────────────────────────────────────────────────
  sektHeader("1.  Opgaveoversigt");
  tabel2([
    ["Sagsnummer", projekt.sagsnummer, "Titel", projekt.titel],
    ["Adresse", projekt.adresse, "", ""],
    ["Kontaktperson", (projekt.kontaktNavn || "") + (projekt.kontaktTlf ? "  ·  " + projekt.kontaktTlf : ""),
     "Grundejer", (projekt.grundejerNavn || "") + (projekt.grundejerTlf ? "  ·  " + projekt.grundejerTlf : "")],
    ["DGU-numre", boringer.map(b => b.dgu).filter(Boolean).join(", "),
     "Dato", projekt.datoFra || "–"],
  ]);

  if (projekt.opgaveBeskrivelse) {
    checkY(8);
    doc.setFont("helvetica","bold"); doc.text("Opgave:", 10, y);
    doc.setFont("helvetica","normal");
    const lines = doc.splitTextToSize(projekt.opgaveBeskrivelse, 150);
    doc.text(lines, 35, y); y += lines.length * 5 + 3;
  }

  // ── 2. Boringer ──────────────────────────────────────────────────────
  sektHeader("2.  Boringer og brønde");
  const typeLabel = t => ({boring:"Boring",brønd:"Brønd",boring_med_brønd:"Boring + brønd"}[t]||t);

  boringer.forEach((bo, i) => {
    checkY(10);
    doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(...BLUE);
    doc.text((i+1) + ".  DGU " + (bo.dgu||"–") + "  ·  " + typeLabel(bo.type), 10, y);
    y += 6; doc.setFontSize(9); doc.setTextColor(...DARK);

    const forerDia = bo.forerDiaFelt || bo.forerDia || "–";
    const forerBund = bo.forerBundFelt || bo.forerBund || "–";
    const rovand = bo.rovandspejlFelt || bo.rovandspejl || "–";
    const dybde = bo.bundpejling || bo.totaldybde || "–";

    if (bo.type !== "brønd") {
      tabel2([
        ["Dybde (m.u.t.)", dybde, "Seneste pejling", rovand],
        ["Forerør Ø (mm)", forerDia, "Forerør bund (m.u.t.)", forerBund],
      ]);
      // Forerør sektioner tabel
      if (bo.forerSections && bo.forerSections.length > 0) {
        checkY(14);
        doc.setFont("helvetica","bold");
        doc.setFillColor(220, 232, 244);
        doc.rect(10, y-4, W, 6, "F");
        doc.text("Forerør – sektioner", 11, y); y += 7;
        doc.setFont("helvetica","normal");
        bo.forerSections.forEach(s => {
          checkY(6);
          const vol = Math.PI * Math.pow(s.dia/2/1000, 2) * (s.bund - s.top) * 1000;
          doc.text(s.top + " – " + s.bund + " m.u.t.", 12, y);
          doc.setFont("helvetica","bold"); doc.text("Ø" + s.dia + " mm", 80, y); doc.setFont("helvetica","normal");
          doc.text(s.materiale || "–", 115, y);
          doc.text(vol.toFixed(1) + " L", 165, y);
          y += 6;
        });
      }
      // Filter sektioner tabel
      if (bo.filterSections && bo.filterSections.length > 0) {
        checkY(14);
        doc.setFont("helvetica","bold");
        doc.setFillColor(220, 232, 244);
        doc.rect(10, y-4, W, 6, "F");
        doc.text("Filtre – sektioner", 11, y); y += 7;
        doc.setFont("helvetica","normal");
        bo.filterSections.forEach(s => {
          checkY(6);
          const vol = Math.PI * Math.pow(s.dia/2/1000, 2) * (s.til - s.fra) * 1000;
          doc.text(s.fra + " – " + s.til + " m.u.t.", 12, y);
          doc.setFont("helvetica","bold"); doc.text("Ø" + s.dia + " mm", 80, y); doc.setFont("helvetica","normal");
          doc.text(s.materiale || "–", 115, y);
          doc.text(vol.toFixed(1) + " L", 165, y);
          y += 6;
        });
      }
    }
    if (bo.type !== "boring") {
      tabel2([["Brønd Ø (mm)", bo.brondDia || "–", "Brønd dybde (m.u.t.)", bo.brondDybde || "–"]]);
    }
    if (bo.noter) {
      checkY(8);
      doc.setFillColor(232, 244, 232);
      const noteLines = doc.splitTextToSize("i  " + bo.noter, W - 8);
      doc.setFillColor(232, 244, 232);
      doc.rect(10, y-4, W, noteLines.length * 5 + 4, "F");
      doc.text(noteLines, 14, y); y += noteLines.length * 5 + 5;
    }
    y += 3;
  });

  // ── 3. Sløjfningsprofil + sekvens ────────────────────────────────────
  sektHeader("3.  Sløjfningsprofil og sekvens");

  // Tegn profil med jsPDF
  const gyldig = beregnetLag.filter(l => l.fraDybde != null);
  if (gyldig.length > 0 && bundpejling) {
    const maks = parseFloat(bundpejling);
    const profH = 80; // mm høj
    const profX = 10;
    const profW_max = 25; // mm bred (max = brønd)
    const harBrond = primær.type === "boring_med_brønd" && primær.brondDia > 0;
    const maksDia = harBrond ? parseFloat(primær.brondDia) : 
      Math.max(...(primær.forerSections||[]).map(s=>s.dia), ...(primær.filterSections||[]).map(s=>s.dia), 200);

    checkY(profH + 20);

    // Terræn-linje

// ─── Helpers ──────────────────────────────────────────────────────────────────
function uid() { return Math.random().toString(36).slice(2, 9); }

// Beregner volumen i liter for en sektion
function beregnVolumen(diaMm, laengdeM) {
  if (!diaMm || !laengdeM || diaMm <= 0 || laengdeM <= 0) return null;
  const r = diaMm / 2 / 1000; // radius i meter
  return Math.PI * r * r * laengdeM * 1000; // liter
}

// Returnerer diameter (mm) ved en given dybde ud fra forerSections + filterSections
function diaVedDybde(dybde, forerSections, filterSections, brondDybde, brondDia) {
  // Brønd-zone: 0 til brondDybde m.u.t.
  // Materialet fylder hele brøndens tværsnit (Ø3000) – forerøret stikker bare op
  // igennem brønden men fortrænger ikke materialet væsentligt i beregningen.
  if (brondDybde > 0 && brondDia > 0 && dybde <= brondDybde) {
    return brondDia;
  }

  // Nedenfor brønd (eller ingen brønd): brug boring-sektionernes dybder direkte
  for (const fs of (filterSections || [])) {
    if (dybde >= fs.fra && dybde <= fs.til) return fs.dia;
  }
  for (const fr of (forerSections || [])) {
    if (dybde >= fr.top && dybde <= fr.bund) return fr.dia;
  }
  // Fallback: under/over alle kendte sektioner
  const allSections = [
    ...(filterSections || []).map(s => ({ dia: s.dia, bund: s.til })),
    ...(forerSections || []).map(s => ({ dia: s.dia, bund: s.bund })),
  ];
  if (allSections.length > 0) {
    const deepest = allSections.reduce((a, b) => b.bund > a.bund ? b : a);
    if (dybde > deepest.bund) return deepest.dia;
    const allForer = (forerSections || []);
    if (allForer.length > 0) return allForer[0].dia;
  }
  return null;
}

// Opdeler et lag [fraDybde, tilDybde] i sub-intervaller ved hvert diameter-skift
function splitVedDiaSkift(fraDybde, tilDybde, forerSections, filterSections, brondDybde) {
  // Saml alle breakpoints inden for intervallet – inkl. brønd-/boring-grænse
  const breaks = new Set([fraDybde, tilDybde]);
  // Brønd-grænse: skift fra brønd-diameter til forerørs-diameter
  if (brondDybde > 0 && brondDybde > fraDybde && brondDybde < tilDybde) {
    breaks.add(brondDybde);
  }
  for (const fr of (forerSections || [])) {
    // Forerør-dybder justeres med brondDybde
    const top = fr.top + (brondDybde || 0);
    const bund = fr.bund + (brondDybde || 0);
    if (top > fraDybde && top < tilDybde) breaks.add(top);
    if (fr.bund > fraDybde && fr.bund < tilDybde) breaks.add(fr.bund);
  }
  for (const fs of (filterSections || [])) {
    if (fs.fra > fraDybde && fs.fra < tilDybde) breaks.add(fs.fra);
    if (fs.til > fraDybde && fs.til < tilDybde) breaks.add(fs.til);
  }
  const sorted = Array.from(breaks).sort((a, b) => a - b);
  return sorted.slice(0, -1).map((fra, i) => {
    const til = sorted[i + 1];
    const midDybde = (fra + til) / 2;
    return { fra, til, dia: diaVedDybde(midDybde, forerSections, filterSections) };
  });
}

function beregnLag(lag, bundpejling, primærBoring) {
  let dybde = parseFloat(bundpejling);
  if (isNaN(dybde)) return lag.map(l => ({ ...l, fraDybde: null, tilDybde: null, tykkelse: null, subLag: [] }));

  const forerSections  = primærBoring?.forerSections  || [];
  const filterSections = primærBoring?.filterSections || [];
  const brondDybde     = (primærBoring?.type === "boring_med_brønd")
                          ? (parseFloat(primærBoring?.brondDybde) || 0) : 0;
  // For firkantet brønd: beregn ækvivalent cirkeldiameter = 2*sqrt(L*B/π)
  const brondDiaRaw    = primærBoring?.brondFirkantet && primærBoring?.brondLaengde && primærBoring?.brondBredde
    ? 2 * Math.sqrt((parseFloat(primærBoring.brondLaengde) * parseFloat(primærBoring.brondBredde)) / Math.PI)
    : (parseFloat(primærBoring?.brondDia) || 0);
  const brondDia       = brondDybde > 0 ? brondDiaRaw : 0;

  return [...lag].reverse().map(l => {
    const mat = MATERIALER.find(m => m.id === l.material);
    const kg  = parseFloat(l.kg);
    if (!mat || isNaN(kg) || kg <= 0) {
      return { ...l, fraDybde: null, tilDybde: null, tykkelse: null, subLag: [] };
    }

    // Hvis en sektion er valgt, brug dens bounds direkte som tilDybde/fraDybde
    // Dette sikrer at laget placeres præcis i sektionens interval uanset bundpejling
    if (l.sektion && l.sektionFra != null && l.sektionTil != null) {
      const sTil = parseFloat(l.sektionTil);
      const sFra = parseFloat(l.sektionFra);
      if (!isNaN(sTil) && !isNaN(sFra) && sTil > sFra) {
        const subLagSektion = splitVedDiaSkift(sFra, sTil, forerSections, filterSections, brondDybde)
          .map(s => {
            const midDybde = (s.fra + s.til) / 2;
            const subDia = diaVedDybde(midDybde, forerSections, filterSections, brondDybde, brondDia)
                        || parseFloat(l.diaMm) || 0;
            return { ...s, dia: subDia };
          });
        const diasArr = [...new Set(subLagSektion.map(s => s.dia).filter(Boolean))];
        const diaStr = diasArr.length > 0 ? diasArr.join(" / ") + " mm" : "";
        dybde = sFra; // opdater dybde til sektionens top
        return { ...l, fraDybde: sFra, tilDybde: sTil, tykkelse: sTil - sFra,
          subLag: subLagSektion, diaStr };
      }
    }

    // Bestem startdiameter (ved nuværende dybde) – inkl. brønd-zone
    const startDia = diaVedDybde(dybde - 0.01, forerSections, filterSections,
                       brondDybde, brondDia)
                  || parseFloat(l.diaMm) || 0;
    if (startDia <= 0) {
      return { ...l, fraDybde: null, tilDybde: null, tykkelse: null, subLag: [],
        diaMm: l.diaMm };
    }

    // Beregn tykkelse ITERATIVT fra bunden og op – diameter skifter undervejs
    // For hvert diameter-interval: beregn hvor mange liter der passer, konverter til meter
    const tilDybde = dybde;
    let restKg = kg;
    let fraDybde = dybde;
    const subLag = [];

    // Find alle diameter-skift-punkter fra dybde og opad mod 0
    // Saml breakpoints: brønd-grænse + forerør-skift + filter-skift
    // Breakpoints: altid terræn-relative m.u.t. – ingen brondDybde-offset
    const allBreaks = new Set([0]);
    if (brondDybde > 0) allBreaks.add(brondDybde); // brønd-/boring-overgang
    (forerSections || []).forEach(fr => {
      allBreaks.add(fr.top); allBreaks.add(fr.bund);
    });
    (filterSections || []).forEach(fs => {
      allBreaks.add(fs.fra); allBreaks.add(fs.til);
    });
    // Sortér faldende (dybeste til øverste)
    const breaksSorted = Array.from(allBreaks).filter(b => b <= dybde).sort((a, b) => b - a);

    for (const bpTop of breaksSorted) {
      if (restKg <= 0.001) break;
      const zoneDia = diaVedDybde((fraDybde + bpTop) / 2 + 0.01,
                        forerSections, filterSections, brondDybde, brondDia)
                    || startDia
                    || parseFloat(l.diaMm) || 0;
      const r = zoneDia / 2 / 1000;
      const lpm = Math.PI * r * r * 1000;
      // Volumen tilgængeligt i dette interval (fra fraDybde ned til bpTop)
      const intervalH = fraDybde - bpTop;
      const maxKgInterval = intervalH * lpm * mat.kgPerL;
      const kgHer = Math.min(restKg, maxKgInterval);
      const hHer = kgHer / (lpm * mat.kgPerL);
      const subTil = fraDybde;
      const subFra = fraDybde - hHer; // tillad negativ (overskud over terræn)
      subLag.unshift({ fra: subFra, til: subTil, dia: zoneDia });
      fraDybde = subFra;
      restKg -= kgHer;
    }
    // Hvis materiale stadig er tilbage (over alle breakpoints), udstræk til 0
    if (restKg > 0.001 && fraDybde > 0) {
      const zoneDia = diaVedDybde(fraDybde / 2, forerSections, filterSections,
                        brondDybde, brondDia) || startDia || parseFloat(l.diaMm) || 0;
      const r = zoneDia / 2 / 1000;
      const lpm = Math.PI * r * r * 1000;
      const hRest = restKg / (lpm * mat.kgPerL);
      const subFra = Math.max(0, fraDybde - hRest);
      subLag.unshift({ fra: subFra, til: fraDybde, dia: zoneDia });
      fraDybde = subFra;
    }

    fraDybde = Math.max(0, fraDybde);
    const tykkelse = tilDybde - fraDybde;
    dybde = fraDybde;

    // Sammensæt diastreng til visning
    const diasArr = [...new Set(subLag.map(s => s.dia).filter(Boolean))];
    const diaStr  = diasArr.length > 0 ? diasArr.join(" / ") + " mm" : (startDia + " mm");

    return { ...l, fraDybde, tilDybde, tykkelse, diaMm: String(startDia), diaStr, subLag };
  }).reverse();
}

// ─── Jupiter-kald (samme origin = ingen CORS) ─────────────────────────────────
async function hentJupiter(dguNr) {
  const clean = dguNr.trim().replace(/^DGU\s*/i, "").replace(/\s/g, "");
  // /api/jupiter er på samme domæne (feltdata-v25.vercel.app) – ingen CORS
  const resp = await fetch("/api/jupiter?dgu=" + encodeURIComponent(clean));
  const json = await resp.json();
  if (!resp.ok || json.error) throw new Error(json.error || "Boring ikke fundet");
  const b = json.boring || {};
  // Seneste pejling: "3.45 (12-03-2024)"
  const sp = b.senestePejling;
  const rovandMedDato = sp
    ? sp.pejling + (sp.dato ? " (" + sp.dato + ")" : "")
    : b.rovandstand || "";
  return {
    dgu:             clean,
    adresse:         b.adresse  || "",
    kommune:         b.kommune  || "",
    totaldybde:      b.dybde    || "",
    rovandspejl:     rovandMedDato,
    forerDia:        b.forerorDiameter  || "",
    forerBund:       b.forerorBund      || "",
    forerSections:   b.forerorSections  || [],
    filterFra:       b.filterFra        || "",
    filterTil:       b.filterTil        || "",
    filterDia:       b.filterDiameter   || "",
    filterSections:  b.filterSectionsUniq || b.filterSections || [],
    borid:           b.boringsid    || "",
    boreholeUrl:     b.boreholeUrl  || "",
    pdfUrl:          b.pdfUrl       || "",
    litho:           json.litho     || [],
    naermestAdresse: json.boring?.naermestAdresse || "",
    utmx: json.boring?.utmx || null,
    utmy: json.boring?.utmy || null,
    gruskastning:    json.boring?.gruskastning || [],
  };
}

function wordFilterRows(bo, filterDia, filterFra, filterTil) {
  if (bo.filterSections && bo.filterSections.length > 0) {

  return '<tr><td class="lbl">Filter Ø (mm)</td><td>' + filterDia + '</td><td class="lbl">Filter fra – til (m.u.t.)</td><td>' + filterFra + ' – ' + filterTil + '</td></tr>';
}

function buildProfilTabel(lag, bundpejling) {
  const maks = parseFloat(bundpejling) || 1;
  const gyldig = lag.filter(l => l.fraDybde != null);
  if (gyldig.length === 0) return "";
  const matLabel = id => (MATERIALER.find(m => m.id === id) || {}).label || id;
  const matFarve = id => (MATERIALER.find(m => m.id === id) || {}).farve || "#ccc";

  let celler1 = "";
  let celler2 = "";
  gyldig.forEach(l => {
    const pct = ((l.tilDybde - l.fraDybde) / maks * 100).toFixed(1);
    const farve = matFarve(l.material);
    const navn  = (matLabel(l.material) || "").split(" ")[0];
    celler1 += '<td style="background:' + farve + '; height:28pt; width:' + pct + '%; border:1px solid #fff; vertical-align:middle; text-align:center; font-size:8pt; color:#fff; font-weight:bold;">' + navn + "</td>";
    celler2 += '<td style="width:' + pct + '%; font-size:8pt; text-align:center; color:#555; padding:2pt;">' + l.fraDybde.toFixed(1) + "–" + l.tilDybde.toFixed(1) + " m</td>";
  });

  return '<table style="width:100%; border-collapse:collapse; margin-bottom:10pt; font-size:9pt;"><tr>' + celler1 + "</tr><tr>" + celler2 + "</tr></table>";
}

function downloadWord(html, sagsnummer) {
  const blob = new Blob(["\ufeff" + html], { type: "application/msword; charset=utf-8" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href     = url;
  a.download = "Arbejdsinstruks_" + (sagsnummer || "sloejfning") + ".doc";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ─── Lag-række ────────────────────────────────────────────────────────────────
function beregnKgFraSektion(diaMm, laengdeM, materialId) {
  const mat = MATERIALER.find(m => m.id === materialId);
  if (!mat || !diaMm || !laengdeM || diaMm <= 0 || laengdeM <= 0) return "";
  const r = diaMm / 2 / 1000;
  const liter = Math.PI * r * r * laengdeM * 1000;
  // Bevar præcis float internt; vis med 1 decimal i feltet
  const præcis = liter * mat.kgPerL;
  return præcis.toFixed(1);
}

function LagRaekke({ lag, i, onChange, onFjern, calc, primær }) {
  const upd = (k, v) => onChange({ ...lag, [k]: v });
  const mat = MATERIALER.find(m => m.id === lag.material);

  // Byg sektions-options fra primær borings forerør + filter
  const forerSek = (primær?.forerSections || []).map((s, idx) => ({
    id: "forer_" + idx,
    label: "Forerør  " + s.top + "–" + s.bund + " m  ·  Ø" + s.dia + " mm  ·  " + s.materiale,
    dia: s.dia, laengde: s.bund - s.top, fraM: s.top, tilM: s.bund,
  }));
  const filterSek = (primær?.filterSections || []).map((s, idx) => ({
    id: "filter_" + idx,
    label: "Filter  " + s.fra + "–" + s.til + " m  ·  Ø" + s.dia + " mm  ·  " + s.materiale,
    dia: s.dia, laengde: s.til - s.fra, fraM: s.fra, tilM: s.til,
  }));
  // Firkantet brønd: brondDia er tom (beregnet) – tjek brondLaengde+brondBredde i stedet
  const harBrondDia = primær?.brondFirkantet
    ? (primær?.brondLaengde && primær?.brondBredde && primær?.brondDybde)
    : (primær?.brondDia && primær?.brondDybde);
  const brondSek = (primær?.type === "boring_med_brønd" || primær?.type === "brønd")
    && harBrondDia
    ? [{ id: "brond_0",
        label: primær.brondFirkantet && primær.brondLaengde && primær.brondBredde
          ? "Brønd (firkantet)  0–" + primær.brondDybde + " m  ·  " + primær.brondLaengde + "×" + primær.brondBredde + " mm  ·  Ækv. Ø" + Math.round(2*Math.sqrt((parseFloat(primær.brondLaengde)*parseFloat(primær.brondBredde))/Math.PI)) + " mm"
          : primær.brondDia
            ? "Brønd  0–" + primær.brondDybde + " m  ·  Ø" + primær.brondDia + " mm"
            : "Brønd  0–" + primær.brondDybde + " m",
        dia: primær.brondFirkantet && primær.brondLaengde && primær.brondBredde
          ? 2 * Math.sqrt((parseFloat(primær.brondLaengde) * parseFloat(primær.brondBredde)) / Math.PI)
          : parseFloat(primær.brondDia),
        laengde: parseFloat(primær.brondDybde),
        fraM: 0, tilM: parseFloat(primær.brondDybde) }]
    : [];
  const alleSektioner = [...brondSek, ...forerSek, ...filterSek];

  function valgSektion(sektionId, materialId) {
    if (!sektionId) {
      onChange({ ...lag, sektion: "", sektionFra: null, sektionTil: null, kg: "" });
      return;
    }
    const sek = alleSektioner.find(s => s.id === sektionId);
    if (!sek) return;
    const kg = beregnKgFraSektion(sek.dia, sek.laengde, materialId || lag.material);
    // Gem sektionens top/bund så beregnLag kan placere laget præcist
    const fra = sek.id.startsWith("forer_") ? sek.fraM
      : sek.id.startsWith("filter_") ? sek.fraM
      : sek.id.startsWith("brond_") ? 0
      : null;
    const til = sek.laengde != null && fra != null ? fra + sek.laengde : null;
    onChange({ ...lag, sektion: sektionId, sektionFra: fra, sektionTil: til, kg });
  }

  function valgMateriale(materialId) {
    // Genberegn kg hvis en sektion er valgt
    if (lag.sektion) {
      const sek = alleSektioner.find(s => s.id === lag.sektion);
      const kg = sek ? beregnKgFraSektion(sek.dia, sek.laengde, materialId) : lag.kg;
      onChange({ ...lag, material: materialId, kg });
    } else {
      upd("material", materialId);
    }
  }

  return (
    <div style={{ background: C.white, border: "1px solid " + C.blue4,
      borderRadius: 8, padding: 14, marginBottom: 10,
      borderLeft: "5px solid " + (mat?.farve || "#ccc") }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
        <span style={{ background: mat?.farve || "#888", color: C.white, borderRadius: "50%",
          width: 26, height: 26, display: "flex", alignItems: "center", justifyContent: "center",
          fontSize: 12, fontWeight: 700, flexShrink: 0 }}>{i + 1}</span>
        <span style={{ fontWeight: 700, color: C.text, flex: 1, fontSize: 13,
          fontFamily: "'Montserrat', sans-serif" }}>{mat?.label || "–"}</span>
        {i > 0 && <button onClick={onFjern}
          style={{ background: "none", border: "none", cursor: "pointer",
            color: C.red, fontSize: 18, lineHeight: 1 }}>✕</button>}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "2fr 2fr 1fr 1fr", gap: "0 12px" }}>
        <div>
          <label style={lbl}>Materiale</label>
          <select style={inp} value={lag.material} onChange={e => valgMateriale(e.target.value)}>
            {MATERIALER.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
          </select>
        </div>
        <div>
          <label style={lbl}>Sektion</label>
          <select style={inp} value={lag.sektion || ""} onChange={e => valgSektion(e.target.value)}>
            <option value="">– Manuel mængde –</option>
            {alleSektioner.length === 0
              ? <option disabled>Hent Jupiter-data på boring</option>
              : alleSektioner.map(s => (
                  <option key={s.id} value={s.id}>{s.label}</option>
                ))
            }
          </select>
          {lag.sektion && alleSektioner.find(s => s.id === lag.sektion) && (() => {
            const sek = alleSektioner.find(s => s.id === lag.sektion);
            const vol = Math.PI * Math.pow(sek.dia/2/1000, 2) * sek.laengde * 1000;
            return <div style={{ fontSize: 10, color: C.text2, marginTop: 2 }}>
              {sek.laengde.toFixed(2)} m · {vol.toFixed(1)} L
            </div>;
          })()}
        </div>
        <div>
          <label style={lbl}>Mængde (kg)</label>
          <input style={inp} type="number" step="0.1"
            value={lag.kg} onChange={e => {
                // Behold sektionsgrænser ved kg-ændring hvis sektion er valgt
                // (sektionen fastlægger placering, kg fastlægger mængde)
                onChange({ ...lag, kg: e.target.value });
              }} placeholder="kg" />
          {mat && <div style={{ fontSize: 10, color: C.text2, marginTop: 2 }}>{mat.kgPerL} kg/L</div>}
        </div>
        <div>
          <label style={lbl}>Ø (mm)</label>
          {/* Ø-felt: read-only (blå) kun når diameter er beregnet fra Jupiter-sektioner.
              Altid redigerbart når ingen Jupiter-data (forerSections tomme). */}
          {calc?.diaStr && (primær?.forerSections?.length > 0 || primær?.filterSections?.length > 0)
            ? <div style={{ ...inp, background: C.blue3, fontWeight: 600,
                color: C.blue, fontSize: 12, display: "flex", alignItems: "center",
                minHeight: 36, cursor: "default" }}>
                {calc.diaStr}
              </div>
            : <input style={inp} type="number" step="1"
                value={lag.diaMm}
                onChange={e => upd("diaMm", e.target.value)}
                placeholder="f.eks. 195" />
          }
          <div style={{ fontSize: 10, color: C.text2, marginTop: 2 }}>
            {calc?.diaStr && (primær?.forerSections?.length > 0 || primær?.filterSections?.length > 0)
              ? "Beregnet fra boring"
              : !lag.diaMm
                ? <span style={{ color: "#e67e22" }}>⚠ Angiv Ø for at tegne profil</span>
                : "Manuel diameter"}
          </div>
        </div>
      </div>
      {calc?.fraDybde != null && (
        <div style={{ marginTop: 8,
          background: calc.fraDybde < 0 ? "#fff3cd" : C.blue3,
          borderRadius: 5, padding: "5px 10px", fontSize: 12,
          color: calc.fraDybde < 0 ? "#8a6d3b" : C.blue, fontWeight: 600 }}>
          {calc.fraDybde < 0
            ? <span style={{ marginRight: 8 }}>⚠ {Math.abs(calc.fraDybde).toFixed(2)} m over terræn</span>
            : null}
          📏 {calc.fraDybde.toFixed(2)} – {calc.tilDybde.toFixed(2)} m.u.t.
          &nbsp;·&nbsp; {calc.tykkelse.toFixed(2)} m tykkelse
          {calc.diaStr && <span style={{ marginLeft: 8, fontWeight: 400, color: C.text2 }}>
            · Ø {calc.diaStr}
          </span>}
        </div>
      )}

    </div>
  );
}

// ─── Profil-visualisering ─────────────────────────────────────────────────────
function beregnBreddePx(dia, harBrond, brondDia, combinedDiasArr, MAXW, BORING_MIN, BORING_MAX) {
  if (!dia || dia <= 0) return BORING_MIN;
  if (!harBrond || dia >= brondDia) {
    // Ingen brønd: skaler relativt til kendte diametre inden for BORING_MIN..BORING_MAX
    var arr2 = (combinedDiasArr || []).filter(Boolean);
    if (arr2.length > 1) {
      var minB2 = Math.min.apply(null, arr2);
      var maxB2 = Math.max.apply(null, arr2);
      if (maxB2 > minB2) {
        var frac2 = (dia - minB2) / (maxB2 - minB2);
        return Math.round(BORING_MIN + frac2 * (BORING_MAX - BORING_MIN));
      }
    }
    return BORING_MAX; // Enkelt diameter: vis med max boring-bredde
  }
  var arr = (combinedDiasArr || []).filter(Boolean);
  var minB = arr.length > 0 ? Math.min.apply(null, arr) : dia;
  var maxB = arr.length > 0 ? Math.max.apply(null, arr) : dia;
  if (maxB <= minB) return Math.round((BORING_MIN + BORING_MAX) / 2);
  var frac = (dia - minB) / (maxB - minB);
  return Math.round(BORING_MIN + frac * (BORING_MAX - BORING_MIN));
}

function Profil({ lag, bundpejling, forerSections, filterSections, brondDybde, brondDia, type, litho, gruskastning, inline }) {
  const maks = parseFloat(bundpejling);
  if (!bundpejling || isNaN(maks) || maks <= 0) return null;
  if (!lag.some(l => l.fraDybde != null)) return null;

  const H = inline ? 300 : 280;
  const MAXW = 80; // max profil-bredde i px (svarer til største diameter)

  // Brønd-zone øverst (0 til brondDybde m.u.t.) hvis boring_med_brønd
  const harBrond = type === "boring_med_brønd" && brondDybde > 0 && brondDia > 0;

  // Find maks boring-diameter for skalering (UDEN brønd – brønd er altid fuld bredde)
  const boringDias = (forerSections || []).map(function(s){return s.dia;}).concat((filterSections || []).map(function(s){return s.dia;})).filter(Boolean);
  const maksBoring = boringDias.length > 0 ? Math.max(...boringDias) : 200;
  // Brønd er altid bredere end boring – vis brønd som fuld MAXW, boring proportionalt
  const maksDia = harBrond ? brondDia : maksBoring;

  // Byg liste af alle diameter-zoner til at tegne profil-konturen
  const diaZoner = [];
  if (harBrond) {
    diaZoner.push({ fra: 0, til: brondDybde, dia: brondDia, erBrond: true });
  }
  (forerSections || []).forEach(function(fr) {
    diaZoner.push({ fra: fr.top, til: fr.bund, dia: fr.dia });
  });
  (filterSections || []).forEach(function(fs) {
    diaZoner.push({ fra: fs.fra, til: fs.til, dia: fs.dia });
  });
  diaZoner.sort(function(a, b) { return a.fra - b.fra; });

  const BORING_MAX = Math.round(MAXW * 0.70);
  const BORING_MIN = Math.round(MAXW * 0.35);
  // Brug den globale beregnBreddePx funktion med lokale parametre
  // Byg diameter-liste: Jupiter-sektioner + manuelle lag-diametre
  const lagDias = lag.reduce(function(acc, l) {
    if (l.subLag && l.subLag.length > 0) {
      l.subLag.forEach(function(s) { if (s.dia > 0) acc.push(s.dia); });
    } else if (parseFloat(l.diaMm) > 0) {
      acc.push(parseFloat(l.diaMm));
    }
    return acc;
  }, []);
  const combinedDias = (forerSections || []).map(function(s){return s.dia;})
    .concat((filterSections || []).map(function(s){return s.dia;}))
    .concat(lagDias)
    .filter(Boolean);
  const breddePx = (dia) => beregnBreddePx(dia, harBrond, brondDia, combinedDias, MAXW, BORING_MIN, BORING_MAX);

  return (
    <div style={{ background: C.white, border: "1px solid " + C.blue4,
      borderRadius: 8, padding: 16, marginTop: inline ? 0 : 16 }}>
      {!inline && <div style={{ fontFamily: "'Montserrat', sans-serif", fontWeight: 700,
        color: C.blue, fontSize: 13, marginBottom: 12 }}>
        📊 Sløjfningsprofil
      </div>}
      <div style={{ display: "flex", gap: 8, alignItems: "flex-start" }}>

        {/* Dybde-labels til venstre – udenfor SVG-containeren */}
        <div style={{ position: "relative", width: 30, height: H, flexShrink: 0 }}>
          {[0, 0.25, 0.5, 0.75, 1].map(frac => (
            <div key={frac} style={{ position: "absolute",
              top: frac * H - 5, right: 2,
              fontSize: 9, color: C.text2, textAlign: "right", lineHeight: 1 }}>
              {(frac * maks).toFixed(1)}
            </div>
          ))}
        </div>

        {/* Profil-søjle */}
        <div style={{ position: "relative", height: H, width: MAXW + 45,
          flexShrink: 0 }}>

          {/* Bygger diaZoner fra subLag hvis ingen Jupiter-sektioner */}
          {(() => {
            // Udvid diaZoner med lag-diametre når ingen sections tilgængelige
            const allZoner = diaZoner.length > 0 ? diaZoner : (() => {
              const zoner = [];
              lag.forEach(l => {
                if (l.fraDybde == null) return;
                const subs = l.subLag && l.subLag.length > 0
                  ? l.subLag
                  : [{ fra: l.fraDybde, til: l.tilDybde, dia: parseFloat(l.diaMm) || maksDia }];
                subs.forEach(s => {
                  if (s.dia > 0) zoner.push({ fra: s.fra, til: s.til, dia: s.dia });
                });
              });
              // Merge overlappende zoner med samme diameter
              zoner.sort((a, b) => a.fra - b.fra);
              const merged = [];
              zoner.forEach(z => {
                const last = merged[merged.length - 1];
                if (last && last.dia === z.dia && z.fra <= last.til) {
                  last.til = Math.max(last.til, z.til);
                } else {
                  merged.push({ ...z });
                }
              });
              return merged;
            })();

            return (
              <svg width={MAXW + 45} height={H}
                style={{ position: "absolute", top: 0, left: 0 }}>
                {/* Baggrund / kontur-zoner */}
                {allZoner.length === 0 && (
                  <rect x={0} y={0} width={MAXW} height={H}
                    fill={C.blue3} stroke={C.blue4} strokeWidth={1} />
                )}
                {allZoner.map((z, i) => {
                  const y1 = z.fra / maks * H;
                  const y2 = Math.min(z.til / maks * H, H);
                  const w  = breddePx(z.dia);
                  const x  = Math.round((MAXW - w) / 2);
                  return (
                    <rect key={i} x={x} y={y1} width={w} height={Math.max(y2 - y1, 1)}
                      fill={z.erBrond ? "#dceeff" : C.blue3}
                      stroke={z.erBrond ? "#2980b9" : C.blue4}
                      strokeWidth={z.erBrond ? 2 : 1} />
                  );
                })}
                {/* Diameter-skift linjer */}
                {allZoner.slice(0, -1).map((z, i) => {
                  const y = z.til / maks * H;
                  const w1 = breddePx(z.dia);
                  const w2 = breddePx(allZoner[i+1]?.dia);
                  const x1 = Math.round((MAXW - w1) / 2);
                  const x2 = Math.round((MAXW - w2) / 2);
                  return (
                    <g key={"dl"+i}>
                      <line x1={x1} y1={y} x2={x2} y2={y}
                        stroke={C.blue} strokeWidth={1.5} strokeDasharray="4,2" />
                      <line x1={x1+w1} y1={y} x2={x2+w2} y2={y}
                        stroke={C.blue} strokeWidth={1.5} strokeDasharray="4,2" />
                      <text x={MAXW+3} y={y+4} fontSize={8} fill={C.blue}>
                        {"Ø" + (allZoner[i+1] ? allZoner[i+1].dia : "")}
                      </text>
                    </g>
                  );
                })}
                {/* Brønd-boring overgang */}
                {harBrond && (
                  <line x1={0} y1={brondDybde / maks * H}
                    x2={MAXW + 45} y2={brondDybde / maks * H}
                    stroke="#2980b9" strokeWidth={2} strokeDasharray="5,3" />
                )}
                {/* Gruskastning – ydre buffer uden på sløjfningsprofil */}
                {(gruskastning || []).map((g, gi) => {
                  const gy1 = g.top / maks * H;
                  const gy2 = Math.min(g.bund / maks * H, H);
                  const profW = breddePx(g.dia || maksDia);
                  const innerW = breddePx(
                    (forerSections||[]).find(f => g.top >= f.top && g.bund <= f.bund)?.dia
                    || maksDia * 0.7
                  );
                  const outerX = Math.round((MAXW - profW) / 2);
                  const innerX = Math.round((MAXW - innerW) / 2);
                  return (
                    <g key={"grus"+gi}>
                      {/* Venstre buffer */}
                      <rect x={outerX} y={gy1} width={innerX - outerX} height={gy2 - gy1}
                        fill="#F4D03F55" stroke="#F4D03F" strokeWidth={1} />
                      {/* Højre buffer */}
                      <rect x={innerX + innerW} y={gy1}
                        width={outerX + profW - innerX - innerW} height={gy2 - gy1}
                        fill="#F4D03F55" stroke="#F4D03F" strokeWidth={1} />
                      {/* Label */}
                      <text x={outerX + 1} y={gy1 + (gy2-gy1)/2 + 3}
                        fontSize={7} fill="#8d6e00" transform={`rotate(-90,${outerX+4},${gy1+(gy2-gy1)/2})`}>
                        Grus
                      </text>
                    </g>
                  );
                })}
                {/* Terræn-linje */}
                <line x1={0} y1={0} x2={MAXW + 45} y2={0}
                  stroke={C.text} strokeWidth={2} />
              </svg>
            );
          })()}

          {/* Lag-farver – absolut positionerede over SVG */}
          {lag.map((l, i) => {
            if (l.fraDybde == null) return null;
            const mat = MATERIALER.find(m => m.id === l.material);
            const subs = l.subLag && l.subLag.length > 0
              ? l.subLag
              : [{ fra: l.fraDybde, til: l.tilDybde, dia: parseFloat(l.diaMm) || maksDia }];
            return subs.map((s, si) => {
              const y  = s.fra / maks * H;
              const h2 = Math.max((s.til - s.fra) / maks * H, 1.5);
              const w  = Math.max(2, breddePx(s.dia) - 2);
              const x  = Math.round((MAXW - w) / 2);
              return (
                <div key={i + "-" + si} style={{
                  position: "absolute",
                  top: y, height: Math.max(h2, 2),
                  left: x, width: w,
                  background: (mat?.farve || "#ccc") + "cc",
                  borderBottom: si < subs.length-1 ? "none" : "1px solid rgba(0,0,0,0.15)",
                  zIndex: 5,
                }} />
              );
            });
          })}
        </div>

        {/* Legende */}
        <div style={{ flex: 1, paddingTop: 4 }}>
          {lag.map((l, i) => {
            if (l.fraDybde == null) return null;
            const mat = MATERIALER.find(m => m.id === l.material);
            return <div key={i} style={{ display: "flex", alignItems: "flex-start",
              gap: 8, marginBottom: 7, fontSize: 12 }}>
              <div style={{ width: 14, height: 14, background: mat?.farve || "#ccc",
                borderRadius: 3, flexShrink: 0, marginTop: 1 }} />
              <div>
                <div style={{ color: C.text, fontWeight: 700 }}>{mat?.label}</div>
                <div style={{ color: C.text2, fontSize: 11 }}>
                  {l.fraDybde.toFixed(2)} – {l.tilDybde.toFixed(2)} m.u.t. · {l.kg} kg
                  {l.diaStr && <span> · Ø {l.diaStr}</span>}
                </div>
              </div>
            </div>;
          })}
          {/* Dybdeskala */}
          <div style={{ marginTop: 12, fontSize: 10, color: C.text2,
            borderTop: "1px solid " + C.blue4, paddingTop: 6 }}>
            ▲ 0 m &nbsp;·&nbsp; ▼ {maks} m.u.t.
            {harBrond && <div style={{ color: "#2980b9", fontWeight: 600 }}>
              Brønd: 0–{brondDybde} m.u.t. (Ø{brondDia} mm)
            </div>}
            {forerSections?.length > 0 && <div>
              {forerSections.map((fr, i) =>
                <span key={i} style={{ marginRight: 8 }}>
                  Forerør {fr.top}–{fr.bund} m: Ø{fr.dia} mm
                </span>
              )}
            </div>}
          </div>
        </div>
          {/* ── Geologi synkroniseret med sløjfningsprofil ──────────── */}
        {litho && litho.length > 0 && bundpejling && (
          <div style={{ borderLeft: "1px solid " + C.blue4, paddingLeft: 8 }}>
            <div style={{ fontFamily: "'Montserrat', sans-serif", fontWeight: 700,
              fontSize: 11, color: C.blue, marginBottom: 4 }}>
              🪨 Geologi
            </div>
            {(() => {
              // Synkroniser med sløjfningsprofil: brug samme H og maks
              const geoMaks = maks; // brug præcis samme skala som sløjfningsprofil
              const geoH = H; // samme højde som profil-SVG

              const geoFarve = (sym) => {
                const s = (sym || "").toLowerCase();
                return s.includes("kalk") || s.includes("kk") ? "#d4edda"
                  : s.includes("smelte") || s.includes("ds") ? "#fff3cd"
                  : s.includes("moræne") || s.includes("ms") || s.includes("ml") ? "#fde2e4"
                  : s.includes("sand") ? "#fff8e1"
                  : s.includes("ler") || s.includes(" l") ? "#fce4ec"
                  : s.includes("grus") ? "#f3e5f5"
                  : s.includes("muld") ? "#d7ccc8"
                  : "#f5f5f5";
              };

              return (
                <div style={{ display: "flex", alignItems: "flex-start", gap: 0 }}>
                  {/* Geologi-blokke absolut positionerede – ingen ekstra dybde-kolonne */}
                  <div style={{ width: 180, flexShrink: 0, position: "relative",
                    height: geoH, border: "1px solid " + C.blue4, overflow: "hidden" }}>
                    {litho.map((l, i) => {
                      const fra = parseFloat(l.fraM) || 0;
                      const til = parseFloat(l.tilM) || fra + 1;
                      const y   = (fra / geoMaks) * geoH;
                      const h2  = Math.max(1, ((til - fra) / geoMaks) * geoH);
                      const sym = l.symbol || "";
                      const besk = (l.beskrivelse || l.tekst || sym || "")
                        .replace("(", "").replace(").", "").replace(")", ""); // fjern ( og ).
                      return (
                        <div key={i} style={{
                          position: "absolute", top: y, left: 0, right: 0,
                          height: h2,
                          background: geoFarve(sym),
                          borderBottom: "1px solid rgba(0,0,0,0.08)",
                          overflow: "hidden",
                          display: "flex", alignItems: "center",
                          padding: "0 6px",
                          fontSize: 9, color: C.text, lineHeight: 1.2,
                        }}>
                          {h2 > 8 && <span style={{ whiteSpace: "nowrap",
                            overflow: "hidden", textOverflow: "ellipsis",
                            display: "block", fontSize: h2 > 14 ? 9 : 8 }}>
                            <span style={{ color: C.text2, marginRight: 3, fontWeight: 600 }}>
                              {fra}–{til}
                            </span>
                            {h2 > 12 ? besk : ""}
                          </span>}
                        </div>
                      );
                    })}
                    {/* Terræn-linje */}
                    <div style={{ position: "absolute", top: 0, left: 0, right: 0,
                      height: 2, background: C.text, zIndex: 10 }} />
                  </div>
                </div>
              );
            })()}
          </div>
        )}
      </div>
    </div>
  );
}

// ─── Hoved-app ────────────────────────────────────────────────────────────────

    id: uid(), dgu: "", type: "boring",
    bundpejling: "", rovandspejlFelt: "",
    forerDiaFelt: "", forerBundFelt: "",
    filterDiaFelt: "", filterFraFelt: "", filterTilFelt: "",
    brondDia: "", brondDybde: "", brondFirkantet: false, brondLaengde: "", brondBredde: "", artesisk: false, pumpeSkalTraekkes: false, noter: "",
    jupiterOk: false, jupiterAdresse: "",
    totaldybde: "", rovandspejl: "",
    forerDia: "", forerBund: "", forerSections: [],
    filterFra: "", filterTil: "", filterDia: "", filterSections: [],
    kommune: "", boreholeUrl: "", pdfUrl: "", litho: [], gruskastning: [], naermestAdresse: "", grundejerNavn: "", grundejerTlf: "", utmx: null, utmy: null,

}

function App() {
  const [fane, setFane] = useState("projekt");

  const [projekt, setProjekt] = useState({
    sagsnummer: "", titel: "", adresse: "",

    artesisk: false, pumpeSkalTraekkes: false,
    opgaveBeskrivelse: "", specialHensyn: "",
    dokumentation: "Tag billeder undervejs af sløjfningsarbejdet\nTag billeder af adgangsvej / kørevej\nRegistrér bundpejling og rovandspejl for hver boring\nRegistrér forbrug af materialer",
  });

  const [boringer, setBoringer] = useState([nyBoring()]);
  // lagPerBoring: { [boringId]: lagArray }
  const [lagPerBoring, setLagPerBoring] = useState(() => ({ [boringer[0].id]: [{ id: uid(), material: "bentonit_pellets", kg: "", diaMm: "" }] }));
  const [aktivBoring, setAktivBoring] = useState(boringer[0].id);
  const [grej, setGrej] = useState([
    "Kuffertgenerator", "Lænsepumpe 2\"", "Slange til lænsepumpe",
    "Bundpejl", "Rovandspejl", "SQ pumpe",
    "Vinkelsliber", "Hjelm", "Høreværn og briller", "Støvmaske/åndedrætsværn",
  ]);
  const [friGrej, setFriGrej] = useState("");

  // ── Attestdata: faktiske målinger ──────────────────────────────────────────
  const [attest, setAttest] = useState({
    dato: "",
    udfoertAf: "",
    bundpejling: "",
    rovandspejl: "",
    pejledato: "",
    forerDia: "",
    forerTop: "",
    noter: "",
    faktiskeLag: [],  // [{materiale, fraM, tilM, faktiskKg, teoretiskKg}]
  });
  const updA = (k, v) => setAttest(a => ({ ...a, [k]: v }));

  const updP = (k, v) => setProjekt(p => ({ ...p, [k]: v }));

  const getLag = (boringId) => lagPerBoring[boringId] || [{ id: uid(), material: "bentonit_pellets", kg: "", diaMm: "" }];

    const cur = prev[boringId] || [{ id: uid(), material: "bentonit_pellets", kg: "", diaMm: "" }];

    return { ...prev, [boringId]: next };

  // Sørg for at nye boringer får lag-arrays
  React.useEffect(() => {
    setLagPerBoring(prev => {
      const next = { ...prev };
      boringer.forEach(b => {
        if (!next[b.id]) next[b.id] = [{ id: uid(), material: "bentonit_pellets", kg: "", diaMm: "" }];
      });
      // Ryd boringer der ikke længere eksisterer
      const ids = new Set(boringer.map(b => b.id));
      Object.keys(next).forEach(k => { if (!ids.has(k)) delete next[k]; });
      return next;

    // Sæt aktiv boring til primær hvis den aktuelle er slettet
    if (!boringer.find(b => b.id === aktivBoring)) setAktivBoring(boringer[0]?.id);

  const primær = boringer.find(b => b.id === aktivBoring) || boringer[0];
  // Bundpejling: for boring_med_brønd bruges boringsdybden (brønden er en del af profilen)

    ? (parseFloat(primær.brondDybde) || 0) : 0;

  const lag = getLag(primær.id);
  const beregnetLag = beregnLag(lag, bundpejling, primær);

      const bBp = b.bundpejling || (b.type === "brønd" ? b.brondDybde : b.totaldybde) || null;
      return beregnLag(bLag, bBp, b);
    });
    const html = buildWordHtml(projekt, boringer, allBeregnetWord, grej, friGrej, bundpejling);
    downloadWord(html, projekt.sagsnummer);
  }

  const faner = [

            Sløjfning af boringer og brønde

      </div>

      {/* Tabs */}

        {faner.map(f => (
          <button key={f.id} onClick={() => setFane(f.id)}

              color: fane === f.id ? C.blue : C.text2,
              borderBottom: fane === f.id ? "3px solid " + C.blue : "3px solid transparent",
              marginBottom: -2, whiteSpace: "nowrap" }}>
            {f.label}
          </button>
        ))}
      </div>

      {/* Indhold */}
      <div style={{ maxWidth: 820, margin: "0 auto", padding: "24px 16px 60px" }}>

        {/* ── PROJEKT ─────────────────────────────────────────────────────── */}
        {fane === "projekt" && <>
          <Sekt n="1" title="Projektinformation" icon="📋" />
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 20px" }}>
            <F label="Sagsnummer"><input style={inp} value={projekt.sagsnummer}
              onChange={e => updP("sagsnummer", e.target.value)} placeholder="f.eks. 20710" /></F>
            <F label="Titel / projekt"><input style={inp} value={projekt.titel}
              onChange={e => updP("titel", e.target.value)} placeholder="f.eks. Egedal grundvandspulje" /></F>
          </div>
          
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 20px" }}>
            <F label="Dato fra"><input style={inp} type="date" value={projekt.datoFra}
              onChange={e => updP("datoFra", e.target.value)} /></F>
            <F label="Dato til"><input style={inp} type="date" value={projekt.datoTil}

            <F label="Kontaktperson navn"><input style={inp} value={projekt.kontaktNavn}

          <div style={{ marginTop: 16 }}>

                      borderRadius: 7, cursor: "pointer",
                      background: aktiv ? C.blue3 : C.white,
                      fontSize: 12, fontWeight: aktiv ? 700 : 400 }}>
                      <input type="checkbox" checked={aktiv} onChange={() =>
                        setGrej(prev => aktiv ? prev.filter(x => x !== e) : [...prev, e])} />
                      {e}

                })}
              </div>
            </div>
          ))}
          <F label="Fritekst-grej (ét styk pr. linje)" col2>
            <textarea style={ta} value={friGrej}

          <button style={btn()} onClick={() => setFane("materialer")}>
            Næste: Materialer →
          </button>
        </>}

        {/* ── MATERIALER ──────────────────────────────────────────────────── */}
        {fane === "materialer" && <>
          <Sekt n="5" title="Materialer" icon="🪣" />
          <p style={{ fontSize: 13, color: C.text2, marginBottom: 18, lineHeight: 1.6 }}>

          </p>
          {(() => {
            const matLabel = id => (MATERIALER.find(m => m.id === id) || {}).label || id;
            const aggr = {};
            // Aggreger fra ALLE boringer
            boringer.forEach(b => {
              const bLag = getLag(b.id);
              const bBp = b.bundpejling || (b.type === "brønd" ? b.brondDybde : b.totaldybde) || null;
              beregnLag(bLag, bBp, b).forEach(l => {
                if (!l.kg || parseFloat(l.kg) <= 0) return;
                aggr[l.material] = (aggr[l.material] || 0) + (parseFloat(l.kg) || 0);
              });
            });
            const entries = Object.entries(aggr);
            if (entries.length === 0) return (
              <div style={{ background: "#fff8e1", border: "1px solid #ffe082",
                borderRadius: 8, padding: "12px 16px", fontSize: 13, color: "#8d6e00" }}>
                💡 Ingen materialer endnu – gå til fanebladet "Sløjfning" og tilføj lag med mængder.
              </div>

            return (
              <div style={{ background: C.white, border: "1px solid " + C.blue4,
                borderRadius: 10, overflow: "hidden" }}>
                {entries.map(([matId, totalKg], i) => {
                  const mat = MATERIALER.find(m => m.id === matId);
                  return (
                    <div key={matId} style={{
                      display: "flex", alignItems: "center", gap: 14,
                      padding: "13px 16px",
                      borderBottom: i < entries.length - 1 ? "1px solid " + C.blue4 : "none",
                      background: i % 2 === 0 ? C.white : C.blue3,

                      <div style={{ width: 14, height: 14, borderRadius: 3, flexShrink: 0,

                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <input
                          type="number" step="10" min="0"

                            // Fordel ny totalKg proportionalt på lag med dette materiale
                            const lagsIndex = beregnetLag.reduce((acc, l, idx) => {

                            if (lagsIndex.length === 1) {
                              setLag(prev => prev.map((l, idx) =>

                  <span>Total</span>

            <button style={btn()} onClick={() => setFane("generer")}>

          </div>

                    })),
                    lag:           allBeregnetFelt,
                    harCement:     harCementFelt,
                    sloejfningsDato: "",
                    udfoertAf:     "",
                  };

                  // Opret boring i feltdata-appen (uses same Supabase)
                  const boringPayload = {
                    id: "sloejf_" + (projekt.sagsnummer || Date.now()),
                    name: (projekt.sagsnummer ? projekt.sagsnummer + " – " : "") +
                          (primær?.naermestAdresse || primær?.dgu || "Sløjfning"),
                    lat: null, lng: null,
                    depth: primær?.bundpejling || primær?.totaldybde || "",
                    rovand: primær?.rovandspejl || "",
                    casing: { dia: primær?.forerSections?.[0]?.dia || "", top: primær?.forerSections?.[0]?.top || "" },
                  };

                  const opgavePayload = {
                    id: "sloejf_op_" + Date.now(),
                    well_id: boringPayload.id,
                    type: "sloejfning",
                    date: new Date().toISOString(),
                    notes: "Sløjfningsinstruks: " + (projekt.sagsnummer || "") + " – " + (projekt.titel || ""),
                    task_data: taskData,
                  };

                  try {
                    // Opret boring via feltdata db.js (table= query param)
                    const boringRes = await fetch("https://feltdata-v25.vercel.app/api/db?table=boringer", {
                      method: "POST",
                      headers: { "Content-Type": "application/json" },
                      body: JSON.stringify(boringPayload),
                    });
                    if (!boringRes.ok) {
                      const err2 = await boringRes.json().catch(() => ({}));
                      throw new Error(err2.error || "Boring kunne ikke oprettes (HTTP " + boringRes.status + ")");
                    }

                    // Opret opgave – feltdata bruger wellId (camelCase)
                    const opgavePayloadMapped = {
                      ...opgavePayload,
                      wellId: opgavePayload.well_id,
                    };
                    const opgaveRes = await fetch("https://feltdata-v25.vercel.app/api/db?table=opgaver", {
                      method: "POST",
                      headers: { "Content-Type": "application/json" },
                      body: JSON.stringify(opgavePayloadMapped),
                    });
                    if (!opgaveRes.ok) {
                      const err2 = await opgaveRes.json().catch(() => ({}));
                      throw new Error(err2.error || "Opgave kunne ikke oprettes (HTTP " + opgaveRes.status + ")");
                    }

                    alert("✅ Sløjfningsopgave oprettet!\n\nSagsnummer: " + (projekt.sagsnummer||"–") + "\nÅbn feltdata-v25.vercel.app på din telefon for at se opgaven.");
                  } catch(err) {
                    alert("❌ Fejl: " + err.message + "\n\nTjek at du er online og at feltdata-v25.vercel.app er tilgængeligt.");
                  }
                }}>
                📱 Opret sløjfningsopgave i feltdata
              </button>
              <a href="https://feltdata-v25.vercel.app" target="_blank" rel="noreferrer"
                style={{ fontSize: 12, color: C.blue }}>
                Åbn feltdata-appen ↗
              </a>
            </div>
          </div>


        {/* ── ATTEST ──────────────────────────────────────────────────────── */}
        {fane === "attest" && <>
          <Sekt n="7" title="Sløjfningsattest" icon="📋" />
          <p style={{ fontSize: 13, color: C.text2, marginBottom: 16, lineHeight: 1.6 }}>
            Udfyld de faktiske data fra sløjfningen. Attesten genereres som PDF og kan indsendes til GEUS.
          </p>

          {/* ── Boringsoversigt ─────────────────────────────────────── */}
          <div style={{ background: C.white, border: "1px solid " + C.blue4,
            borderRadius: 10, padding: 16, marginBottom: 16 }}>
            <div style={{ fontFamily: "'Montserrat',sans-serif", fontWeight: 700,
              fontSize: 13, color: C.blue, marginBottom: 12 }}>
              Boringskonstruktion
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 16px" }}>
              <F label="DGU-nummer"><input style={inp} value={primær.dgu || ""} readOnly /></F>
              <F label="Adresse"><input style={inp} value={projekt.adresse || ""} readOnly /></F>
              <F label="Forerør Ø, OD (mm)">
                <input style={inp} type="number" value={attest.forerDia}
                  onChange={e => updA("forerDia", e.target.value)}
                  placeholder={primær.forerSections?.[0]?.dia || "f.eks. 254"} />
              </F>
              <F label="Forerør top (m.u.t.)">
                <input style={inp} type="number" step="0.01" value={attest.forerTop}
                  onChange={e => updA("forerTop", e.target.value)}
                  placeholder={primær.forerSections?.[0]?.top || "f.eks. 2.5"} />
              </F>
              <F label="Bundpejling (m.u.t.)">
                <input style={inp} type="number" step="0.01" value={attest.bundpejling}
                  onChange={e => updA("bundpejling", e.target.value)}
                  placeholder={bundpejling || ""} />
              </F>
              <F label="Rovandspejl (m.u.t.)">
                <input style={inp} type="number" step="0.01" value={attest.rovandspejl}
                  onChange={e => updA("rovandspejl", e.target.value)}
                  placeholder={primær.rovandspejl || ""} />
              </F>
              <F label="Pejledato">
                <input style={inp} type="date" value={attest.pejledato}
                  onChange={e => updA("pejledato", e.target.value)} />
              </F>
              <F label="Sløjfning udført">
                <input style={inp} type="date" value={attest.dato}
                  onChange={e => updA("dato", e.target.value)} />
              </F>
              <F label="Udført af"><input style={inp} value={attest.udfoertAf}
                onChange={e => updA("udfoertAf", e.target.value)}
                placeholder="Navn / firma" /></F>
              <F label="Sagsnummer"><input style={inp} value={projekt.sagsnummer || ""} readOnly /></F>
            </div>
          </div>

          {/* ── Faktiske sløjfningsmængder ──────────────────────────── */}
          <div style={{ background: C.white, border: "1px solid " + C.blue4,
            borderRadius: 10, padding: 16, marginBottom: 16 }}>
            <div style={{ fontFamily: "'Montserrat',sans-serif", fontWeight: 700,
              fontSize: 13, color: C.blue, marginBottom: 12 }}>
              Faktiske sløjfningsmængder
            </div>

            {/* Tabel-header */}
            <div style={{ display: "grid",
              gridTemplateColumns: "2fr 1fr 1fr 1fr 1fr",
              gap: "0 8px", marginBottom: 6 }}>
              {["Materiale","Fra (m.u.t.)","Til (m.u.t.)","Teoretisk (kg)","Faktisk (kg)"].map(h => (
                <div key={h} style={{ fontSize: 10, fontWeight: 700, color: C.blue,
                  fontFamily: "'Montserrat',sans-serif", textTransform: "uppercase",
                  letterSpacing: "0.3px" }}>{h}</div>
              ))}
            </div>

            {/* Rækker baseret på beregnetLag – auto-udfyldt med teoretiske mængder */}
            {(() => {
              const matNavn = { bentonit_pellets:"Bentonit pellets",
                bentonit_grout:"Bentonit grout", cementgrout:"Cementgrout",
                filtersand:"Filtersand", aertesten:"Ærtesten",
                stabilgrus:"Stabilgrus", brogrus:"Brogrus",
                muld:"Muld", cement_stolpe:"Stolpebeton" };
              const rows = attest.faktiskeLag.length > 0
                ? attest.faktiskeLag
                : beregnetLag.filter(l => l.fraDybde != null).map(l => ({
                    materiale: matNavn[l.material] || l.material,
                    fraM: l.fraDybde?.toFixed(2) || "",
                    tilM: l.tilDybde?.toFixed(2) || "",
                    teoretiskKg: l.kg || "",
                    faktiskKg: "",
                  }));

              return rows.map((r, i) => (
                <div key={i} style={{ display: "grid",
                  gridTemplateColumns: "2fr 1fr 1fr 1fr 1fr",
                  gap: "0 8px", marginBottom: 6, alignItems: "center" }}>
                  <input style={{ ...inp, fontSize: 12 }} value={r.materiale}
                    onChange={e => {
                      const next = [...(attest.faktiskeLag.length > 0 ? attest.faktiskeLag : rows)];
                      next[i] = { ...next[i], materiale: e.target.value };
                      updA("faktiskeLag", next);
                    }} />
                  <input style={{ ...inp, fontSize: 12 }} type="number" step="0.01"
                    value={r.fraM}
                    onChange={e => {
                      const next = [...(attest.faktiskeLag.length > 0 ? attest.faktiskeLag : rows)];
                      next[i] = { ...next[i], fraM: e.target.value };
                      updA("faktiskeLag", next);
                    }} />
                  <input style={{ ...inp, fontSize: 12 }} type="number" step="0.01"
                    value={r.tilM}
                    onChange={e => {
                      const next = [...(attest.faktiskeLag.length > 0 ? attest.faktiskeLag : rows)];
                      next[i] = { ...next[i], tilM: e.target.value };
                      updA("faktiskeLag", next);
                    }} />
                  <div style={{ ...inp, fontSize: 12, background: C.blue3,
                    color: C.text2, display: "flex", alignItems: "center" }}>
                    {r.teoretiskKg} kg
                  </div>
                  <input style={{ ...inp, fontSize: 12 }} type="number" step="0.1"
                    placeholder="kg"
                    value={r.faktiskKg}
                    onChange={e => {
                      const next = [...(attest.faktiskeLag.length > 0 ? attest.faktiskeLag : rows)];
                      next[i] = { ...next[i], faktiskKg: e.target.value };
                      updA("faktiskeLag", next);
                    }} />
                </div>
              ));
            })()}

            {/* Tilføj/fjern lag-knapper */}
            <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
              <button style={btn("#34495e", { fontSize: 12, padding: "6px 12px" })}
                onClick={() => {
                  const cur = attest.faktiskeLag.length > 0
                    ? attest.faktiskeLag
                    : beregnetLag.filter(l=>l.fraDybde!=null).map(l=>({
                        materiale:({"bentonit_pellets":"Bentonit pellets",bentonit_grout:"Bentonit grout",cementgrout:"Cementgrout",filtersand:"Filtersand",aertesten:"Ærtesten",stabilgrus:"Stabilgrus",brogrus:"Brogrus",muld:"Muld",cement_stolpe:"Stolpebeton"})[l.material]||l.material,
                        fraM:l.fraDybde?.toFixed(2)||"",tilM:l.tilDybde?.toFixed(2)||"",
                        teoretiskKg:l.kg||"",faktiskKg:""}));
                  updA("faktiskeLag", [...cur, {materiale:"",fraM:"",tilM:"",teoretiskKg:"",faktiskKg:""}]);
                }}>
                + Tilføj lag
              </button>
              {attest.faktiskeLag.length > 0 && (
                <button style={btn("#C0392B", { fontSize: 12, padding: "6px 12px" })}
                  onClick={() => updA("faktiskeLag", attest.faktiskeLag.slice(0,-1))}>
                  − Fjern sidste
                </button>
              )}
            </div>
          </div>

          {/* ── Cementgrout støbedata ───────────────────────────────── */}
          {beregnetLag.some(l => l.material === "cementgrout" || l.material === "cement_stolpe") && (
            <div style={{ background: C.white, border: "1px solid " + C.blue4,
              borderRadius: 10, padding: 16, marginBottom: 16 }}>
              <div style={{ fontFamily: "'Montserrat',sans-serif", fontWeight: 700,
                fontSize: 13, color: C.blue, marginBottom: 12 }}>
                Cementgrout støbedata
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "0 16px" }}>
                <F label="Antal blandinger total">
                  <input style={inp} type="number"
                    value={attest.antalBlandinger || ""}
                    onChange={e => updA("antalBlandinger", e.target.value)} />
                </F>
                <F label="Volumen per blanding (L)">
                  <input style={inp} type="number"
                    value={attest.volPerBlanding || ""}
                    onChange={e => updA("volPerBlanding", e.target.value)} />
                </F>
                <F label="Total vol. nedpumpet (L)">
                  <input style={{ ...inp, background: C.blue3 }}
                    readOnly
                    value={attest.antalBlandinger && attest.volPerBlanding
                      ? (parseFloat(attest.antalBlandinger) * parseFloat(attest.volPerBlanding)).toFixed(0) + " L"
                      : ""} />
                </F>
                <F label="Kontrolrumvægt (g/cm³)">
                  <input style={inp} type="number" step="0.01"
                    value={attest.kontrolRumvaegt || ""}
                    onChange={e => updA("kontrolRumvaegt", e.target.value)} />
                </F>
                <F label="Cementforbrug total (kg)">
                  <input style={inp} type="number"
                    value={attest.cementKg || ""}
                    onChange={e => updA("cementKg", e.target.value)} />
                </F>
                <F label="Bentonitforbrug (kg)">
                  <input style={inp} type="number"
                    value={attest.bentonitKg || ""}
                    onChange={e => updA("bentonitKg", e.target.value)} />
                </F>
              </div>
            </div>
          )}

          {/* ── Noter ───────────────────────────────────────────────── */}
          <F label="Noter til sløjfningsarbejdet" col2>
            <textarea style={{ ...ta, minHeight: 60 }} value={attest.noter}
              onChange={e => updA("noter", e.target.value)}
              placeholder="Afvigelser, observationer, særlige forhold..." />
          </F>

          {/* ── Generer PDF ─────────────────────────────────────────── */}
          <div style={{ marginTop: 20 }}>
            <button style={{ ...btn(), width: "100%", padding: 14, fontSize: 15,
              boxShadow: "0 3px 12px rgba(17,105,176,0.3)" }}
              onClick={() => genererAttest(projekt, primær, beregnetLag, attest)}>
              📋 Generer sløjfningsattest (PDF)
            </button>
            <p style={{ fontSize: 11, color: C.text2, textAlign: "center", marginTop: 6 }}>
              Kan indsendes til GEUS og opgraderes som bilag til sagen
            </p>
          </div>
        </>}

        </>}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
